<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOT-Step Album Generator</title>
<style>
  :root {
    --bg: #0a0a0f; --surface: #12121a; --surface2: #1a1a26; --surface3: #222233;
    --border: #2a2a3a; --border-focus: #a855f7; --text: #e4e4e7; --text2: #a1a1aa;
    --text3: #71717a; --accent: #a855f7; --accent2: #7c3aed; --accent3: #c084fc;
    --green: #22c55e; --red: #ef4444; --orange: #f59e0b; --blue: #3b82f6;
    --pink: #ec4899;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
  
  .header { background: linear-gradient(135deg, #1a0a2e 0%, #0d1117 50%, #0a0a0f 100%); border-bottom: 1px solid var(--border); padding: 20px 32px; display: flex; align-items: center; gap: 16px; }
  .header h1 { font-size: 22px; font-weight: 700; background: linear-gradient(135deg, var(--accent3), var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .header .subtitle { color: var(--text3); font-size: 12px; }
  .header .back-btn { margin-left: auto; padding: 6px 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text2); font-size: 12px; cursor: pointer; text-decoration: none; transition: all 0.2s; }
  .header .back-btn:hover { background: var(--surface3); color: var(--text); }
  
  .main { max-width: 960px; margin: 0 auto; padding: 24px 32px 80px; }
  
  .section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .section-title { font-size: 13px; font-weight: 600; color: var(--accent3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .section-title .icon { font-size: 16px; }
  
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .form-row.single { grid-template-columns: 1fr; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group label { font-size: 11px; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.3px; }
  .form-group input, .form-group select, .form-group textarea {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; color: var(--text); font-size: 13px; outline: none; transition: border-color 0.2s;
    font-family: inherit; resize: vertical;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--border-focus); }
  .form-group textarea { min-height: 60px; }
  .form-group select { cursor: pointer; }
  
  .genre-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .genre-chip { padding: 4px 10px; border-radius: 16px; font-size: 11px; cursor: pointer; border: 1px solid var(--border); background: var(--surface2); color: var(--text2); transition: all 0.2s; user-select: none; }
  .genre-chip:hover { border-color: var(--accent); color: var(--text); }
  .genre-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  
  /* Track Cards */
  .tracks-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .track-count { font-size: 12px; color: var(--text3); }
  
  .track-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; overflow: hidden; transition: border-color 0.2s; }
  .track-card.active { border-color: var(--accent); }
  .track-card.completed { border-color: var(--green); }
  .track-card.error { border-color: var(--red); }
  
  .track-header { padding: 12px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
  .track-num { width: 28px; height: 28px; border-radius: 50%; background: var(--surface3); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--text2); flex-shrink: 0; }
  .track-card.active .track-num { background: var(--accent); color: #fff; }
  .track-card.completed .track-num { background: var(--green); color: #fff; }
  .track-card.error .track-num { background: var(--red); color: #fff; }
  .track-title-display { font-size: 14px; font-weight: 500; color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-title-display.empty { color: var(--text3); font-style: italic; }
  .track-toggle { color: var(--text3); font-size: 12px; transition: transform 0.2s; }
  .track-card.expanded .track-toggle { transform: rotate(180deg); }
  
  .track-body { display: none; padding: 0 16px 16px; }
  .track-card.expanded .track-body { display: block; }
  
  .track-status { padding: 8px 12px; border-radius: 6px; font-size: 11px; display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .track-status.pending { background: rgba(168,85,247,0.1); color: var(--accent3); }
  .track-status.generating { background: rgba(59,130,246,0.1); color: var(--blue); }
  .track-status.completed { background: rgba(34,197,94,0.1); color: var(--green); }
  .track-status.error { background: rgba(239,68,68,0.1); color: var(--red); }
  .track-status.queued { background: rgba(245,158,11,0.1); color: var(--orange); }
  
  .progress-bar { height: 3px; background: var(--surface3); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--pink)); border-radius: 2px; transition: width 0.3s; }
  
  /* Buttons */
  .btn { padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
  .btn-secondary { background: var(--surface2); border: 1px solid var(--border); color: var(--text2); }
  .btn-secondary:hover:not(:disabled) { background: var(--surface3); color: var(--text); }
  .btn-danger { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: var(--red); }
  .btn-danger:hover:not(:disabled) { background: rgba(239,68,68,0.25); }
  .btn-success { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); color: var(--green); }
  .btn-sm { padding: 5px 12px; font-size: 11px; }
  
  .actions-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10,10,15,0.95); backdrop-filter: blur(12px); border-top: 1px solid var(--border); padding: 14px 32px; display: flex; align-items: center; gap: 12px; z-index: 100; }
  .actions-bar .spacer { flex: 1; }
  
  .overall-progress { flex: 1; max-width: 400px; }
  .overall-progress-text { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
  
  /* Results */
  .result-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--surface2); border-radius: 6px; margin-top: 8px; }
  .result-row audio { flex: 1; height: 32px; }
  .result-row .dl-btn { padding: 4px 10px; background: var(--surface3); border: 1px solid var(--border); border-radius: 4px; color: var(--text2); font-size: 11px; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .result-row .dl-btn:hover { color: var(--text); background: var(--border); }
  
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--surface3); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .empty-state { text-align: center; padding: 40px; color: var(--text3); }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 13px; }
  
  .token-bar { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
  .token-bar .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .token-bar .status-dot.connected { background: var(--green); }
  .token-bar .status-dot.disconnected { background: var(--red); }
  .token-bar .status-text { font-size: 12px; color: var(--text2); flex: 1; }
  
  @media (max-width: 640px) {
    .main { padding: 16px; }
    .form-row { grid-template-columns: 1fr; }
    .header { padding: 16px; }
    .actions-bar { padding: 10px 16px; }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>ALBUM GENERATOR</h1>
    <div class="subtitle">Generate up to 9 tracks with full control per song</div>
  </div>
  <a href="/" class="back-btn">Back to HOT-Step</a>
</div>

<div class="main" id="app">
  <div class="empty-state" id="loading">
    <div class="spinner" style="width:32px;height:32px;border-width:3px;"></div>
    <p style="margin-top:12px;">Connecting to HOT-Step...</p>
  </div>
</div>

<div class="actions-bar" id="actions-bar" style="display:none;">
  <div class="overall-progress" id="overall-progress-wrap">
    <div class="overall-progress-text" id="overall-text">Ready</div>
    <div class="progress-bar"><div class="progress-fill" id="overall-fill" style="width:0%"></div></div>
  </div>
  <div class="spacer"></div>
  <button class="btn btn-secondary btn-sm" onclick="addTrack()" id="add-track-btn">+ Add Track</button>
  <button class="btn btn-danger btn-sm" onclick="cancelAll()" id="cancel-btn" style="display:none;">Cancel All</button>
  <button class="btn btn-primary" onclick="generateAlbum()" id="generate-btn">Generate Album</button>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let TOKEN = null;
let PROVIDERS = [];
let SELECTED_PROVIDER = '';
let SELECTED_MODEL = '';
let ALBUM_TITLE = '';
let ALBUM_THEME = '';
let ALBUM_GENRE = '';
let LANGUAGES = [
  {code:'en',name:'English'},{code:'es',name:'Spanish'},{code:'fr',name:'French'},
  {code:'de',name:'German'},{code:'pt',name:'Portuguese'},{code:'ja',name:'Japanese'},
  {code:'ko',name:'Korean'},{code:'zh',name:'Chinese'},{code:'ar',name:'Arabic'},
  {code:'hi',name:'Hindi'},{code:'ru',name:'Russian'},{code:'it',name:'Italian'}
];
let SELECTED_LANG = 'en';
let TRACKS = [];
let GENERATING = false;
let CANCEL_FLAG = false;

const GENRE_LIST = [
  'Rock','Pop','Hip-Hop','R&B','Country','Folk','Jazz','Blues','Classical',
  'Electronic','Dance','Techno','House','Trance','Drum & Bass','Dubstep','Lo-Fi',
  'Metal','Punk','Grunge','Indie','Alternative','Reggae','Dub','Ska','Dancehall',
  'Reggae (Patois)','Dub (Patois)','Dancehall (Patois)',
  'Latin','Salsa','Reggaeton','Bachata','Cumbia',
  'K-Pop','J-Pop','Bollywood','Afrobeats','Amapiano',
  'Gospel','Soul','Funk','Disco','Synthwave','Vaporwave',
  'Bluegrass','Country Rock','Honky Tonk','Outlaw Country',
  'Prog Rock','Post-Rock','Shoegaze','Math Rock',
  'Doom Metal','Black Metal','Death Metal','Power Metal','Symphonic Metal',
  'Grime','Trap','Drill','Boom Bap','Conscious Hip-Hop','Jazz Rap',
  'Ambient','New Age','Cinematic','Soundtrack',
  'Hardcore','Ska Punk','Oi!','Street Punk',
  'Deep House','Tech House','Minimal','Glitch','IDM',
  'Smooth Jazz','Bebop','Swing','Fusion','Vocal Jazz',
  'Opera','Chamber','Baroque','Romantic',
  'Garage Rock','Surf Rock','Psych Rock','Space Rock','Stoner Rock',
  'Breakcore','Jungle','UK Garage','Future Bass','Chillstep',
  'Blue-eyed Soul','Motown','Northern Soul',
  'Tango','Bossa Nova','Samba','Flamenco','Fado',
  'Ska Jazz','Reggae Rock','Dub Techno',
  'Hardstyle','Happy Hardcore','Psytrance','Goa Trance',
  'Downtempo','Trip-Hop','Electro Swing',
  'Trap Soul','Emo Rap','Cloud Rap',
  'Celtic','Nordic Folk','Balkan','Polka',
  'Yacht Rock','AOR','Soft Rock','Power Pop','Britpop',
  'Garage Punk','Post-Punk','New Wave','Gothic Rock','Darkwave','Coldwave',
  'Grindcore','Djent','Post-Metal','Sludge Metal','Stoner Metal',
  'Afrobeat','Highlife','Mbalax','Kwaito','Bongo Flava',
  'Brega','Forró','Zouk','Kompa','Coupé-Décalé',
  'Merengue','Cumbia Villera','Cumbia Sonidera','Dembow',
  'Phonk','Drift Phonk','Witch House','Wave',
  'Lofi Hip-Hop','Chillhop','Jazzhop',
  'Bluegrass Gospel','Texas Country','Red Dirt',
  'Post-Hardcore','Emo','Screamo','Metalcore','Deathcore',
  'Noise Rock','Mathcore','Avant-Garde Metal',
  'Symphonic Black Metal','Folk Metal','Viking Metal','Pagan Metal',
  'Power Noise','Rhythmic Noise','Dark Ambient','Drone',
  'Indie Pop','Indie Folk','Indie Rock','Dream Pop','Shimmer Pop',
  'Neo-Soul','Alternative R&B','PBR&B',
  'Afro House','Gqom','Amapiano','Bass House',
  'Hardbass','Eurodance','Italo Disco','Hi-NRG',
  'Chiptune','8-bit','Bitpop',
  'Reggae Fusion','Ragga','Lovers Rock','Roots Reggae',
  'DJ','Dual DJ','Turntablism','Scratch Battle',
  'Porn Groove','SFW Porn Groove'
];

// ── Helpers ──────────────────────────────────────────────────────────────
function $(id) { return document.getElementById(id); }
function api(path, opts={}) {
  const h = {'Content-Type':'application/json'};
  if (TOKEN) h['Authorization'] = 'Bearer ' + TOKEN;
  return fetch(path, {...opts, headers: {...h, ...opts.headers}})
    .then(r => r.json().then(d => { if (!r.ok) throw new Error(d.error||r.statusText); return d; }));
}

// ── Init ──────────────────────────────────────────────────────────────────
async function init() {
  try {
    const auth = await api('/api/auth/auto');
    TOKEN = auth.token;
    localStorage.setItem('hs-album-token', TOKEN);
  } catch(e) {
    // Try cached token
    const cached = localStorage.getItem('hs-album-token');
    if (cached) {
      TOKEN = cached;
      try { await api('/api/auth/me'); } catch { TOKEN = null; }
    }
    if (!TOKEN) {
      try {
        const auth = await api('/api/auth/auto');
        TOKEN = auth.token;
        localStorage.setItem('hs-album-token', TOKEN);
      } catch(e2) {
        $('loading').innerHTML = '<div class="empty-state"><p style="color:var(--red)">Cannot connect to HOT-Step server. Make sure it is running.</p></div>';
        return;
      }
    }
  }

  // Fetch providers
  try {
    const provs = await api('/api/inspire/llm/providers');
    PROVIDERS = Array.isArray(provs) ? provs : [];
    // Filter to available providers only
    PROVIDERS = PROVIDERS.filter(p => p.available);
    if (PROVIDERS.length === 0) PROVIDERS = Array.isArray(provs) ? provs : []; // fallback to all if none available
    if (PROVIDERS.length > 0) {
      SELECTED_PROVIDER = PROVIDERS[0].id || PROVIDERS[0].name || '';
      SELECTED_MODEL = PROVIDERS[0].default_model || '';
    }
  } catch(e) { console.warn('Failed to fetch providers:', e); }

  // Load saved album config
  try {
    const saved = JSON.parse(localStorage.getItem('hs-album-config') || '{}');
    ALBUM_TITLE = saved.title || '';
    ALBUM_THEME = saved.theme || '';
    ALBUM_GENRE = saved.genre || '';
    SELECTED_LANG = saved.lang || 'en';
    SELECTED_PROVIDER = saved.provider || SELECTED_PROVIDER;
    SELECTED_MODEL = saved.model || SELECTED_MODEL;
    if (saved.tracks && Array.isArray(saved.tracks)) {
      TRACKS = saved.tracks;
    }
  } catch(e) {}

  if (TRACKS.length === 0) {
    for (let i = 0; i < 9; i++) TRACKS.push({subject:'',lyrics:'',title:'',genreOverride:''});
  }

  render();
}

function saveConfig() {
  try {
    localStorage.setItem('hs-album-config', JSON.stringify({
      title: ALBUM_TITLE, theme: ALBUM_THEME, genre: ALBUM_GENRE, lang: SELECTED_LANG,
      provider: SELECTED_PROVIDER, model: SELECTED_MODEL,
      tracks: TRACKS.map(t => ({subject:t.subject,lyrics:t.lyrics,title:t.title,genreOverride:t.genreOverride}))
    }));
  } catch(e) {}
}

// ── Render ──────────────────────────────────────────────────────────────
function render() {
  const app = $('app');
  const provOpts = PROVIDERS.map(p => {
    const name = p.id || p.name || 'unknown';
    const models = (p.models || []).map(m => typeof m === 'string' ? m : (m.id || m.name || ''));
    return {name, models, available: p.available};
  });

  app.innerHTML = `
    <!-- Token Status -->
    <div class="token-bar">
      <div class="status-dot ${TOKEN ? 'connected' : 'disconnected'}"></div>
      <div class="status-text">${TOKEN ? 'Connected to HOT-Step' : 'Not connected'}</div>
    </div>

    <!-- Album Metadata -->
    <div class="section">
      <div class="section-title"><span class="icon">💿</span> Album Info</div>
      <div class="form-row">
        <div class="form-group">
          <label>Album Title</label>
          <input type="text" value="${esc(ALBUM_TITLE)}" placeholder="My Album" oninput="ALBUM_TITLE=this.value;saveConfig()">
        </div>
        <div class="form-group">
          <label>Album Theme / Concept</label>
          <input type="text" value="${esc(ALBUM_THEME)}" placeholder="e.g. A journey through night markets in Tokyo" oninput="ALBUM_THEME=this.value;saveConfig()">
          <span style="font-size:10px;color:var(--text3);margin-top:2px;">Optional. Injected into each track's prompt to unify the album.</span>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Overall Genre / Style</label>
          <select onchange="ALBUM_GENRE=this.value==='__custom__'?'':this.value;saveConfig();if(this.value==='__custom__'){this.nextElementSibling.style.display='block'}else{this.nextElementSibling.style.display='none'}">
            <option value="" ${!ALBUM_GENRE?'selected':''}>— Select genre —</option>
            ${GENRE_LIST.map(g => `<option value="${esc(g)}" ${g===ALBUM_GENRE?'selected':''}>${esc(g)}</option>`).join('')}
            <option value="__custom__" ${ALBUM_GENRE && !GENRE_LIST.includes(ALBUM_GENRE)?'selected':''}>Custom genre...</option>
          </select>
          <input type="text" value="${esc(ALBUM_GENRE && !GENRE_LIST.includes(ALBUM_GENRE)?ALBUM_GENRE:'')}" placeholder="Type custom genre" style="display:${ALBUM_GENRE && !GENRE_LIST.includes(ALBUM_GENRE)?'block':'none'};margin-top:4px;"
            oninput="ALBUM_GENRE=this.value;saveConfig()">
        </div>
        <div class="form-group">
          <label>LLM Provider</label>
          <select onchange="SELECTED_PROVIDER=this.value;const opt=this.options[this.selectedIndex];SELECTED_MODEL=opt?.dataset?.model||'';saveConfig()">
            ${provOpts.map(p => `<option value="${esc(p.name)}" data-model="${esc(p.models[0]||'')}" ${p.name===SELECTED_PROVIDER?'selected':''}${!p.available?' style="color:var(--text3)"':''}>${esc(p.name)}${!p.available?' (no API key)':''}${p.models.length?' — '+p.models[0]:''}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label>Language</label>
          <select onchange="SELECTED_LANG=this.value;saveConfig()">
            ${LANGUAGES.map(l => `<option value="${l.code}" ${l.code===SELECTED_LANG?'selected':''}>${l.name}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="form-row single">
        <div class="form-group">
          <label>Model (select from list or type custom)</label>
          ${(() => {
            const selProv = PROVIDERS.find(p => (p.id||p.name) === SELECTED_PROVIDER);
            const models = selProv ? (selProv.models||[]) : [];
            if (models.length > 0) {
              return `<select onchange="SELECTED_MODEL=this.value==='__custom__'?'':this.value;saveConfig();if(this.value==='__custom__'){this.nextElementSibling.style.display='block'}else{this.nextElementSibling.style.display='none'}">
                ${models.map(m => `<option value="${esc(m)}" ${m===SELECTED_MODEL?'selected':''}>${esc(m)}</option>`).join('')}
                <option value="__custom__" ${!models.includes(SELECTED_MODEL)?'selected':''}>Custom model name...</option>
              </select>
              <input type="text" value="${esc(!models.includes(SELECTED_MODEL)?SELECTED_MODEL:'')}" placeholder="Type custom model name" style="display:${!models.includes(SELECTED_MODEL)?'block':'none'};margin-top:4px;"
                oninput="SELECTED_MODEL=this.value;saveConfig()">`;
            }
            return `<input type="text" value="${esc(SELECTED_MODEL)}" placeholder="e.g. gpt-4o, claude-sonnet-4-20250514, gemma4:12b" oninput="SELECTED_MODEL=this.value;saveConfig()">`;
          })()}
        </div>
      </div>
      <div class="form-row single" style="margin-top:8px;">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <button class="btn btn-primary btn-sm" onclick="autoFillAlbum()" id="autofill-btn">✨ Auto-Fill Album</button>
          <button class="btn btn-secondary btn-sm" onclick="shuffleTracks()" id="shuffle-btn">🎲 Shuffle Tracks</button>
          <span style="font-size:10px;color:var(--text3);">Generate a complete album concept — story arc for themed albums, genre-appropriate variety for others</span>
        </div>
      </div>
    </div>

    <!-- Tracks -->
    <div class="section" style="padding-bottom:8px;">
      <div class="tracks-header">
        <div class="section-title" style="margin-bottom:0;"><span class="icon">🎵</span> Tracks (${TRACKS.filter(t=>t.subject||t.lyrics).length}/${TRACKS.length} configured)</div>
      </div>
    </div>
    <div id="tracks-list">
      ${TRACKS.map((t,i) => renderTrack(t,i)).join('')}
    </div>
  `;
  $('actions-bar').style.display = 'flex';
  updateOverall();
}

function renderTrack(t, i) {
  const isActive = t._status === 'generating' || t._status === 'queued';
  const isDone = t._status === 'completed';
  const isError = t._status === 'error';
  const isExpanded = t._expanded !== false && i === (TRACKS.findIndex(x=>x._expanded) >= 0 ? TRACKS.findIndex(x=>x._expanded) : 0);
  const cls = ['track-card'];
  if (isExpanded) cls.push('expanded');
  if (isActive) cls.push('active');
  if (isDone) cls.push('completed');
  if (isError) cls.push('error');
  
  const displayTitle = t.title || t.subject || `Track ${i+1}`;
  const titleCls = (t.title || t.subject) ? 'track-title-display' : 'track-title-display empty';

  let statusHtml = '';
  if (t._status === 'queued') {
    statusHtml = `<div class="track-status queued"><span class="spinner"></span>Queued...</div>`;
  } else if (t._status === 'generating') {
    statusHtml = `<div class="track-status generating"><span class="spinner"></span>${esc(t._stage||'Generating...')}</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${t._progress||0}%"></div></div>`;
  } else if (t._status === 'completed') {
    statusHtml = `<div class="track-status completed">✓ Complete</div>`;
    if (t._audioUrl) {
      statusHtml += `<div class="result-row">
        <audio controls src="${esc(t._audioUrl)}" style="flex:1;height:32px;"></audio>
        <a class="dl-btn" href="${esc(t._audioUrl)}" download="${esc(t.title||'track-'+(i+1))+'.wav'}">Download</a>
      </div>`;
    }
    if (t._lyrics) {
      statusHtml += `<details style="margin-top:8px;"><summary style="font-size:11px;color:var(--text3);cursor:pointer;">View Generated Lyrics</summary>
        <pre style="font-size:11px;color:var(--text2);margin-top:6px;white-space:pre-wrap;font-family:inherit;background:var(--surface2);padding:8px;border-radius:4px;">${esc(t._lyrics)}</pre></details>`;
    }
  } else if (t._status === 'error') {
    statusHtml = `<div class="track-status error">✗ ${esc(t._error||'Error')}</div>`;
  }

  // Filter out unsupported genres
  const filteredGenres = GENRE_LIST;

  return `<div class="${cls.join(' ')}" id="track-${i}">
    <div class="track-header" onclick="toggleTrack(${i})">
      <div class="track-num">${isDone?'✓':isError?'✗':i+1}</div>
      <div class="${titleCls}">${esc(displayTitle)}</div>
      <div class="track-toggle">▼</div>
    </div>
    <div class="track-body">
      <div class="form-row">
        <div class="form-group">
          <label>Subject / Theme</label>
          <input type="text" value="${esc(t.subject)}" placeholder="e.g. A midnight drive through the city" 
            oninput="TRACKS[${i}].subject=this.value;saveConfig();render()" ${GENERATING?'disabled':''}>
        </div>
        <div class="form-group">
          <label>Track Title (optional — LLM will generate if empty)</label>
          <input type="text" value="${esc(t.title)}" placeholder="Auto-generated if empty"
            oninput="TRACKS[${i}].title=this.value;saveConfig();render()" ${GENERATING?'disabled':''}>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Genre Override (optional — uses album genre if empty)</label>
          <select onchange="TRACKS[${i}].genreOverride=this.value==='__custom__'?'':this.value;saveConfig();if(this.value==='__custom__'){this.nextElementSibling.style.display='block'}else{this.nextElementSibling.style.display='none'}" ${GENERATING?'disabled':''}>
            <option value="" ${!t.genreOverride?'selected':''}>— Use album genre —</option>
            ${GENRE_LIST.map(g => `<option value="${esc(g)}" ${g===t.genreOverride?'selected':''}>${esc(g)}</option>`).join('')}
            <option value="__custom__" ${t.genreOverride && !GENRE_LIST.includes(t.genreOverride)?'selected':''}>Custom...</option>
          </select>
          <input type="text" value="${esc(t.genreOverride && !GENRE_LIST.includes(t.genreOverride)?t.genreOverride:'')}" placeholder="Type custom genre" style="display:${t.genreOverride && !GENRE_LIST.includes(t.genreOverride)?'block':'none'};margin-top:4px;"
            oninput="TRACKS[${i}].genreOverride=this.value;saveConfig();render()" ${GENERATING?'disabled':''}>
        </div>
        <div class="form-group" style="justify-content:flex-end;">
          <button class="btn btn-secondary btn-sm" onclick="generateSubject(${i})" ${GENERATING?'disabled':''} style="margin-top:auto;">
            Random Subject
          </button>
        </div>
      </div>
      <div class="form-row single">
        <div class="form-group">
          <label>Custom Lyrics (optional — LLM generates if empty)</label>
          <textarea rows="4" placeholder="Leave empty to auto-generate lyrics based on subject. Paste your own lyrics here to use them instead."
            oninput="TRACKS[${i}].lyrics=this.value;saveConfig();render()" ${GENERATING?'disabled':''}>${esc(t.lyrics||'')}</textarea>
        </div>
      </div>
      ${statusHtml}
    </div>
  </div>`;
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function toggleTrack(i) {
  const wasExpanded = document.getElementById('track-'+i)?.classList.contains('expanded');
  document.querySelectorAll('.track-card').forEach(c => c.classList.remove('expanded'));
  if (!wasExpanded) {
    TRACKS.forEach((t,j) => t._expanded = (j===i));
    document.getElementById('track-'+i)?.classList.add('expanded');
  }
}

function addTrack() {
  if (TRACKS.length >= 9) return;
  TRACKS.push({subject:'',lyrics:'',title:'',genreOverride:''});
  saveConfig();
  render();
  toggleTrack(TRACKS.length - 1);
}

// ── Random Subject ──────────────────────────────────────────────────────
async function generateSubject(i) {
  if (!SELECTED_PROVIDER || !TOKEN) return alert('Select an LLM provider first');
  const track = TRACKS[i];
  const genre = track.genreOverride || ALBUM_GENRE || 'any genre';
  try {
    const r = await api('/api/inspire/llm/subject', {
      method: 'POST', body: JSON.stringify({provider: SELECTED_PROVIDER, model: SELECTED_MODEL||undefined, genres: [genre]})
    });
    if (r.subject) {
      track.subject = r.subject;
      saveConfig();
      render();
      toggleTrack(i);
    }
  } catch(e) { alert('Subject generation failed: ' + e.message); }
}

// ── Auto-Fill Album ──────────────────────────────────────────────────────
async function autoFillAlbum() {
  if (!SELECTED_PROVIDER || !TOKEN) return alert('Select an LLM provider first');
  if (!ALBUM_GENRE) return alert('Select a genre first');

  const btn = $('autofill-btn');
  const shuffleBtn = $('shuffle-btn');
  const origText = btn?.textContent;
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Generating concept...'; }
  if (shuffleBtn) shuffleBtn.disabled = true;

  try {
    const hasTheme = ALBUM_THEME && ALBUM_THEME.trim().length > 0;
    // Count tracks that already have content; if none, fill all 9
    const activeCount = TRACKS.filter(t => t.subject || t.lyrics).length || TRACKS.length;

    let subjectPrompt = `Design a ${activeCount}-track ${ALBUM_GENRE} album`;
    if (hasTheme) subjectPrompt += ` with the concept: "${ALBUM_THEME}"`;
    subjectPrompt += `. Generate ${activeCount} tracks that form a cohesive album.`;

    const sysPrompt = `You are an expert music producer and album concept designer. You design album track listings with compelling themes and subjects.

Output your response in this EXACT format — one line per field, no JSON, no markdown, no code blocks:

THEME: A 1-2 sentence album concept/theme description
TITLE: Album title (2-5 words, catchy)
1: Track Title | A 2-3 sentence description of what this song is about — enough detail for a lyricist to write from. Concrete images, specific scenarios, emotional arc.
2: Track Title | A 2-3 sentence description...
3: Track Title | A 2-3 sentence description...
...continue for every track...

CRITICAL RULES:
- EVERY line must start with either "THEME:", "TITLE:", or a number followed by colon.
- Every track subject must be DIFFERENT — no two tracks about the same thing.
- Each subject must contain CONCRETE IMAGES (places, objects, actions, sensory details) — never abstract concepts.
- ${hasTheme
    ? 'The tracks should tell a STORY ARC across the album: Act 1 (tracks 1-2) = Setup — introduce the world/characters. Act 2 (middle tracks) = Conflict/Journey — raise stakes, explore different angles. Final tracks = Resolution — climax, transformation, the final image.'
    : 'Vary the mood, tempo feel, and lyrical themes across tracks. Make each track feel like a distinct chapter — different scene, different emotion, different energy level — but all belonging to the same genre universe.'}
- Titles should be SHORT (1-4 words), evocative, and memorable.
- Never repeat a title word across tracks (e.g. if one track is "Midnight Rain" don't use "rain" in another title).`;

    const result = await api('/api/inspire/llm', {
      method: 'POST',
      body: JSON.stringify({
        provider: SELECTED_PROVIDER,
        model: SELECTED_MODEL || undefined,
        genres: [ALBUM_GENRE],
        subject: subjectPrompt,
        language: SELECTED_LANG,
        systemPrompt: sysPrompt
      })
    });

    // Parse the response — line-based format: THEME:/TITLE:/N: Title | Subject
    let concept = null;
    const raw = result.lyrics || '';
    console.log('[AutoFill] Raw LLM response:', raw.substring(0, 500));

    // Strategy 1: Parse our line-based format (THEME:/TITLE:/N: Title | Subject)
    {
      const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
      const theme = lines.find(l => /^THEME:\s*/i.test(l))?.replace(/^THEME:\s*/i, '').trim() || '';
      const title = lines.find(l => /^TITLE:\s*/i.test(l))?.replace(/^TITLE:\s*/i, '').trim() || '';
      const tracks = [];
      for (const line of lines) {
        const m = line.match(/^(\d+):\s*(.+)/);
        if (m) {
          const parts = m[2].split('|').map(s => s.trim());
          tracks.push({ title: parts[0] || '', subject: parts.slice(1).join(' | ') || parts[0] || '' });
        }
      }
      if (tracks.length > 0) concept = { theme, title, tracks };
    }

    // Strategy 2: try JSON (some models output JSON anyway)
    if (!concept) {
      try { concept = JSON.parse(raw); } catch {}
    }

    // Strategy 3: extract JSON from markdown code blocks
    if (!concept) {
      const m = raw.match(/```(?:json)?\s*([\s\S]*?)```/);
      if (m) try { concept = JSON.parse(m[1]); } catch {}
    }

    // Strategy 4: find outermost { ... } in the text
    if (!concept) {
      const start = raw.indexOf('{');
      const end = raw.lastIndexOf('}');
      if (start >= 0 && end > start) {
        try { concept = JSON.parse(raw.substring(start, end + 1)); } catch {}
      }
    }

    // Strategy 5: brute-force — extract any "number: Title | Subject" lines
    if (!concept || !concept.tracks) {
      const tracks = [];
      const lines = raw.split('\n');
      for (const line of lines) {
        const m = line.trim().match(/^(\d+)[.:)\]]\s*(.+)/);
        if (m) {
          const parts = m[2].split('|').map(s => s.trim());
          tracks.push({ title: parts[0] || '', subject: parts.slice(1).join(' | ') || parts[0] || '' });
        }
      }
      if (tracks.length >= 2) {
        concept = { theme: '', title: '', tracks };
      }
    }

    if (!concept || !concept.tracks || !Array.isArray(concept.tracks) || concept.tracks.length === 0) {
      console.error('[AutoFill] All parse strategies failed. Raw response:', raw);
      throw new Error('Could not parse album concept. Check the browser console (F12) for the raw LLM response. Try a different provider or fill tracks manually.');
    }

    // Apply results
    if (concept.theme) ALBUM_THEME = concept.theme;
    if (concept.title && !ALBUM_TITLE) ALBUM_TITLE = concept.title;

    const numToFill = Math.min(concept.tracks.length, TRACKS.length);
    for (let i = 0; i < numToFill; i++) {
      const t = concept.tracks[i];
      if (t.title) TRACKS[i].title = t.title;
      if (t.subject) TRACKS[i].subject = t.subject;
      TRACKS[i].lyrics = '';          // clear so generateAlbum will re-LLM
      TRACKS[i]._expanded = false;
    }

    saveConfig();
    render();
    toggleTrack(0);

  } catch(e) {
    alert('Auto-fill failed: ' + e.message);
    console.error('Auto-fill error:', e);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = origText || '✨ Auto-Fill Album'; }
    if (shuffleBtn) shuffleBtn.disabled = false;
  }
}

// ── Shuffle Tracks (re-roll subjects, keep theme) ───────────────────────
async function shuffleTracks() {
  if (!SELECTED_PROVIDER || !TOKEN) return alert('Select an LLM provider first');
  if (!ALBUM_GENRE) return alert('Select a genre first');

  const hasAnyContent = TRACKS.some(t => t.subject || t.lyrics);
  if (!hasAnyContent) return autoFillAlbum(); // nothing to shuffle — do full auto-fill instead

  const btn = $('shuffle-btn');
  const autoBtn = $('autofill-btn');
  const origText = btn?.textContent;
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Shuffling...'; }
  if (autoBtn) autoBtn.disabled = true;

  try {
    const activeCount = TRACKS.filter(t => t.subject || t.lyrics).length || TRACKS.length;
    const hasTheme = ALBUM_THEME && ALBUM_THEME.trim().length > 0;

    // Build a compact summary of current state so LLM knows what to replace
    const currentSummary = TRACKS.filter(t => t.subject || t.title)
      .map((t, idx) => `${idx+1}. "${t.title || '(no title)'}" — ${(t.subject||'').substring(0, 120)}`)
      .join('\n');

    let subjectPrompt = `Replace the track subjects for a ${activeCount}-track ${ALBUM_GENRE} album`;
    if (hasTheme) subjectPrompt += ` with theme: "${ALBUM_THEME}"`;
    subjectPrompt += `. Current tracks:\n${currentSummary}\n\nGenerate completely NEW subjects and (optionally better) titles. Keep the album cohesive but make every track feel fresh — different scene, emotion, and energy.`;

    const sysPrompt = `You are an expert music producer shuffling an album's track listing.

Output your response in this EXACT format — one line per field:

1: New Title | A 2-3 sentence description — concrete images, specific scenarios, emotional arc. Enough for a lyricist to write from.
2: New Title | A 2-3 sentence description...
...continue for every track...

RULES:
- EVERY line must start with a number followed by colon.
- Every track must be DISTINCT from the others.
- Subjects must contain CONCRETE IMAGES — never abstract concepts.
- Titles must be SHORT and evocative.
- Don't repeat title words across tracks.`;

    const result = await api('/api/inspire/llm', {
      method: 'POST',
      body: JSON.stringify({
        provider: SELECTED_PROVIDER,
        model: SELECTED_MODEL || undefined,
        genres: [ALBUM_GENRE],
        subject: subjectPrompt,
        language: SELECTED_LANG,
        systemPrompt: sysPrompt
      })
    });

    // Parse — same line-based format as autoFill
    let concept = null;
    const raw = result.lyrics || '';
    console.log('[Shuffle] Raw LLM response:', raw.substring(0, 500));

    // Strategy 1: line-based format (N: Title | Subject)
    {
      const tracks = [];
      for (const line of raw.split('\n')) {
        const m = line.trim().match(/^(\d+)[.:)\]]\s*(.+)/);
        if (m) {
          const parts = m[2].split('|').map(s => s.trim());
          tracks.push({ title: parts[0] || '', subject: parts.slice(1).join(' | ') || parts[0] || '' });
        }
      }
      if (tracks.length > 0) concept = { tracks };
    }

    // Strategy 2: JSON
    if (!concept) try { concept = JSON.parse(raw); } catch {}
    // Strategy 3: JSON in code blocks
    if (!concept) {
      const m = raw.match(/```(?:json)?\s*([\s\S]*?)```/);
      if (m) try { concept = JSON.parse(m[1]); } catch {}
    }
    // Strategy 4: outermost { ... }
    if (!concept) {
      const start = raw.indexOf('{');
      const end = raw.lastIndexOf('}');
      if (start >= 0 && end > start) try { concept = JSON.parse(raw.substring(start, end + 1)); } catch {}
    }

    if (!concept || !concept.tracks || !Array.isArray(concept.tracks)) {
      console.error('[Shuffle] All parse strategies failed. Raw:', raw);
      throw new Error('Could not parse shuffled tracks. Check the browser console (F12) for the raw LLM response.');
    }

    const numToFill = Math.min(concept.tracks.length, TRACKS.length);
    for (let i = 0; i < numToFill; i++) {
      const t = concept.tracks[i];
      if (t.title) TRACKS[i].title = t.title;
      if (t.subject) TRACKS[i].subject = t.subject;
      TRACKS[i].lyrics = '';
      TRACKS[i]._expanded = false;
    }

    saveConfig();
    render();
    toggleTrack(0);

  } catch(e) {
    alert('Shuffle failed: ' + e.message);
    console.error('Shuffle error:', e);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = origText || '🎲 Shuffle Tracks'; }
    if (autoBtn) autoBtn.disabled = false;
  }
}

// ── Generate Album ──────────────────────────────────────────────────────
async function generateAlbum() {
  if (GENERATING) return;
  
  // Validate
  const activeTracks = TRACKS.filter(t => t.subject || t.lyrics);
  if (activeTracks.length === 0) return alert('Configure at least one track with a subject or lyrics.');
  if (!SELECTED_PROVIDER) return alert('Select an LLM provider first.');

  GENERATING = true;
  CANCEL_FLAG = false;
  $('generate-btn').disabled = true;
  $('cancel-btn').style.display = '';
  $('add-track-btn').disabled = true;
  updateOverall();

  // Process tracks sequentially
  for (let i = 0; i < TRACKS.length; i++) {
    const t = TRACKS[i];
    if (!t.subject && !t.lyrics) continue;
    if (CANCEL_FLAG) break;

    // Expand this track
    toggleTrack(i);

    try {
      // Step 1: Generate lyrics via LLM (if not provided)
      if (!t.lyrics) {
        t._status = 'generating';
        t._stage = 'Generating lyrics via LLM...';
        t._progress = 0;
        render();
        toggleTrack(i);

        const genres = [t.genreOverride || ALBUM_GENRE || 'Rock'];
        const subjectWithTheme = ALBUM_THEME
          ? (t.subject ? `${t.subject} (Album theme: ${ALBUM_THEME})` : ALBUM_THEME)
          : t.subject;
        const llmResult = await api('/api/inspire/llm', {
          method: 'POST',
          body: JSON.stringify({
            provider: SELECTED_PROVIDER,
            model: SELECTED_MODEL || undefined,
            genres: genres,
            subject: subjectWithTheme,
            language: SELECTED_LANG
          })
        });
        
        t.lyrics = llmResult.lyrics || '';
        t.title = t.title || llmResult.title || '';
        t._caption = llmResult.caption || genres.join(', ');
        t._bpm = llmResult.bpm;
        t._key = llmResult.key;
        t._duration = llmResult.duration;
        t._timeSignature = llmResult.timeSignature;
        t._lyrics = llmResult.lyrics; // Store for display
      } else {
        t._caption = t.genreOverride || ALBUM_GENRE || 'Rock';
      }

      if (CANCEL_FLAG) break;

      // Step 2: Submit to audio engine
      t._stage = 'Submitting to audio engine...';
      t._progress = 5;
      render();
      toggleTrack(i);

      const genParams = {
        prompt: t._caption || t.genreOverride || ALBUM_GENRE || '',
        lyrics: t.lyrics,
        title: t.title || t.subject || `Track ${i+1}`,
        caption: t._caption || '',
        songDescription: t._caption || '',
        randomSeed: true,
        source: 'album',
        vocalLanguage: SELECTED_LANG,
      };
      if (t._bpm) genParams.bpm = t._bpm;
      // Ensure minimum 180s so the song has room for the outro — LLMs often omit duration
      genParams.duration = t._duration || 180;
      if (t._key) genParams.keyScale = t._key;
      if (t._timeSignature) genParams.timeSignature = t._timeSignature;

      const subResult = await api('/api/generate', { method:'POST', body: JSON.stringify(genParams) });
      const jobId = subResult.jobId;
      if (!jobId) throw new Error('No jobId returned');
      t._jobId = jobId;
      t._status = 'queued';
      t._stage = 'Queued...';
      render();
      toggleTrack(i);

      // Step 3: Poll until done
      let timedOut = false;
      const startTime = Date.now();
      const TIMEOUT_MS = 15 * 60 * 1000; // 15 min per track

      while (!CANCEL_FLAG) {
        await sleep(2000);
        
        if (Date.now() - startTime > TIMEOUT_MS) {
          throw new Error('Generation timed out after 15 minutes');
        }

        try {
          const status = await api(`/api/generate/status/${jobId}`);
          
          t._stage = status.stage || 'Generating...';
          t._progress = status.progress != null ? (status.progress > 1 ? status.progress/100 * 100 : status.progress * 100) : t._progress;
          render();
          toggleTrack(i);

          if (status.status === 'succeeded') {
            t._audioUrl = status.result?.audioUrls?.[0] || '';
            t._songId = status.result?.songIds?.[0];
            t._masteredUrl = status.result?.masteredAudioUrl || '';
            t._finalDuration = status.result?.duration;
            t._status = 'completed';
            t._stage = 'Complete!';
            t._progress = 100;
            render();
            toggleTrack(i);
            break;
          }

          if (status.status === 'failed' || status.status === 'cancelled') {
            throw new Error(status.error || `Generation ${status.status}`);
          }
        } catch(e) {
          if (e.message.includes('timed out') || e.message.includes('Generation')) throw e;
          // Transient error, keep polling
          console.warn('Poll error:', e.message);
        }
      }
    } catch(e) {
      t._status = 'error';
      t._error = e.message;
      t._stage = 'Failed';
      render();
      toggleTrack(i);
      console.error(`Track ${i+1} failed:`, e);
    }
  }

  GENERATING = false;
  CANCEL_FLAG = false;
  $('generate-btn').disabled = false;
  $('cancel-btn').style.display = 'none';
  $('add-track-btn').disabled = false;
  updateOverall();
}

function cancelAll() {
  CANCEL_FLAG = true;
}

function updateOverall() {
  const total = TRACKS.filter(t => t.subject || t.lyrics).length;
  const done = TRACKS.filter(t => t._status === 'completed').length;
  const err = TRACKS.filter(t => t._status === 'error').length;
  const active = TRACKS.filter(t => t._status === 'generating' || t._status === 'queued').length;

  let text = 'Ready';
  let pct = 0;

  if (GENERATING) {
    if (total > 0) {
      pct = Math.round((done / total) * 100);
      text = `Track ${done + (active > 0 ? 1 : 0)} of ${total} — ${done} complete${err > 0 ? ', ' + err + ' failed' : ''}`;
    }
  } else if (done > 0 || err > 0) {
    text = `Done — ${done} complete, ${err} failed, ${total - done - err} skipped`;
    pct = total > 0 ? Math.round((done / total) * 100) : 0;
  }

  const ot = $('overall-text');
  const of = $('overall-fill');
  if (ot) ot.textContent = text;
  if (of) of.style.width = pct + '%';
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── Start ──────────────────────────────────────────────────────────────
init();
</script>
