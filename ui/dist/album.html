<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOT-Step Album Generator</title>
<style>
  :root {
    --bg: #0a0a0f; --surface: #12121a; --surface2: #1a1a26; --surface3: #222233;
    --border: #2a2a3a; --border-focus: #a855f7; --text: #e4e4e7; --text2: #a1a1aa;
    --text3: #71717a; --accent: #a855f7; --accent2: #7c3aed; --accent3: #c084fc;
    --green: #22c55e; --red: #ef4444; --orange: #f59e0b; --blue: #3b82f6;
    --pink: #ec4899;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
  
  .header { background: linear-gradient(135deg, #1a0a2e 0%, #0d1117 50%, #0a0a0f 100%); border-bottom: 1px solid var(--border); padding: 20px 32px; display: flex; align-items: center; gap: 16px; }
  .header h1 { font-size: 22px; font-weight: 700; background: linear-gradient(135deg, var(--accent3), var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .header .subtitle { color: var(--text3); font-size: 12px; }
  .header .back-btn { margin-left: auto; padding: 6px 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text2); font-size: 12px; cursor: pointer; text-decoration: none; transition: all 0.2s; }
  .header .back-btn:hover { background: var(--surface3); color: var(--text); }
  
  .main { max-width: 960px; margin: 0 auto; padding: 24px 32px 80px; }
  
  .section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .section-title { font-size: 13px; font-weight: 600; color: var(--accent3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .section-title .icon { font-size: 16px; }
  
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .form-row.single { grid-template-columns: 1fr; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group label { font-size: 11px; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.3px; }
  .form-group input, .form-group select, .form-group textarea {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; color: var(--text); font-size: 13px; outline: none; transition: border-color 0.2s;
    font-family: inherit; resize: vertical;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--border-focus); }
  .form-group textarea { min-height: 60px; }
  .form-group select { cursor: pointer; }
  
  .genre-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .genre-chip { padding: 4px 10px; border-radius: 16px; font-size: 11px; cursor: pointer; border: 1px solid var(--border); background: var(--surface2); color: var(--text2); transition: all 0.2s; user-select: none; }
  .genre-chip:hover { border-color: var(--accent); color: var(--text); }
  .genre-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* Multi-select genre picker */
  .genre-picker { position: relative; }
  .genre-picker-trigger { min-height: 42px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); padding: 6px 10px; cursor: pointer; display: flex; flex-wrap: wrap; align-items: center; gap: 5px; transition: border-color 0.2s; }
  .genre-picker-trigger:hover { border-color: var(--accent); }
  .genre-picker-trigger.open { border-color: var(--accent); border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .genre-picker-trigger .placeholder { color: var(--text3); font-size: 12px; user-select: none; }
  .genre-picker-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; background: rgba(168,85,247,0.15); color: #c084fc; border: 1px solid rgba(168,85,247,0.25); transition: background 0.15s; }
  .genre-picker-chip:hover { background: rgba(168,85,247,0.25); }
  .genre-picker-chip .remove { cursor: pointer; font-size: 13px; line-height: 1; opacity: 0.7; transition: opacity 0.15s; }
  .genre-picker-chip .remove:hover { opacity: 1; }
  .genre-picker-trigger .actions { margin-left: auto; display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .genre-picker-trigger .actions .clear-btn { font-size: 10px; color: var(--text3); cursor: pointer; transition: color 0.15s; background: none; border: none; padding: 2px 4px; }
  .genre-picker-trigger .actions .clear-btn:hover { color: var(--red); }
  .genre-picker-trigger .actions .chevron { color: var(--text3); transition: transform 0.2s; font-size: 10px; }
  .genre-picker-trigger.open .actions .chevron { transform: rotate(180deg); }
  .genre-picker-dropdown { position: absolute; top: 100%; left: 0; right: 0; max-height: 380px; border: 1px solid var(--accent); border-top: none; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; background: var(--surface); z-index: 50; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
  .genre-picker-search { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .genre-picker-search input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 5px 8px; color: var(--text); font-size: 12px; outline: none; }
  .genre-picker-search input:focus { border-color: var(--accent); }
  .genre-picker-search .search-icon { color: var(--text3); font-size: 12px; }
  .genre-picker-list { flex: 1; overflow-y: auto; padding: 4px 0; }
  .genre-picker-cat-header { padding: 6px 12px 2px; font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; position: sticky; top: 0; background: var(--surface); }
  .genre-picker-cat-genres { padding: 2px 8px 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .genre-picker-opt { padding: 3px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; border: 1px solid transparent; background: transparent; color: var(--text2); transition: all 0.15s; }
  .genre-picker-opt:hover { background: var(--surface3); color: var(--text); }
  .genre-picker-opt.selected { background: rgba(168,85,247,0.15); color: #c084fc; border-color: rgba(168,85,247,0.3); }
  .genre-picker-empty { text-align: center; padding: 20px; color: var(--text3); font-size: 12px; }
  .genre-picker-custom { padding: 6px 10px; border-top: 1px solid var(--border); display: flex; gap: 6px; }
  .genre-picker-custom input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 5px 8px; color: var(--text); font-size: 12px; outline: none; }
  .genre-picker-custom input:focus { border-color: var(--accent); }
  .genre-picker-custom button { padding: 4px 10px; border-radius: 4px; font-size: 11px; background: var(--accent); color: #fff; border: none; cursor: pointer; white-space: nowrap; }
  .genre-picker-random { padding: 6px 10px; border-top: 1px solid var(--border); }
  .genre-picker-random button { width: 100%; padding: 5px; border-radius: 4px; font-size: 11px; background: linear-gradient(135deg, var(--accent), #7c3aed); color: #fff; border: none; cursor: pointer; font-weight: 600; transition: filter 0.15s; }
  .genre-picker-random button:hover { filter: brightness(1.1); }
  
  /* Track Cards */
  .tracks-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .track-count { font-size: 12px; color: var(--text3); }
  
  .track-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; overflow: hidden; transition: border-color 0.2s; }
  .track-card.active { border-color: var(--accent); }
  .track-card.completed { border-color: var(--green); }
  .track-card.error { border-color: var(--red); }
  
  .track-header { padding: 12px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
  .track-num { width: 28px; height: 28px; border-radius: 50%; background: var(--surface3); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--text2); flex-shrink: 0; }
  .track-card.active .track-num { background: var(--accent); color: #fff; }
  .track-card.completed .track-num { background: var(--green); color: #fff; }
  .track-card.error .track-num { background: var(--red); color: #fff; }
  .track-title-display { font-size: 14px; font-weight: 500; color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-title-display.empty { color: var(--text3); font-style: italic; }
  .track-toggle { color: var(--text3); font-size: 12px; transition: transform 0.2s; }
  .track-card.expanded .track-toggle { transform: rotate(180deg); }
  
  .track-body { display: none; padding: 0 16px 16px; }
  .track-card.expanded .track-body { display: block; }
  
  .track-status { padding: 8px 12px; border-radius: 6px; font-size: 11px; display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .track-status.pending { background: rgba(168,85,247,0.1); color: var(--accent3); }
  .track-status.generating { background: rgba(59,130,246,0.1); color: var(--blue); }
  .track-status.completed { background: rgba(34,197,94,0.1); color: var(--green); }
  .track-status.error { background: rgba(239,68,68,0.1); color: var(--red); }
  .track-status.queued { background: rgba(245,158,11,0.1); color: var(--orange); }
  
  .progress-bar { height: 3px; background: var(--surface3); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--pink)); border-radius: 2px; transition: width 0.3s; }
  
  /* Buttons */
  .btn { padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
  .btn-secondary { background: var(--surface2); border: 1px solid var(--border); color: var(--text2); }
  .btn-secondary:hover:not(:disabled) { background: var(--surface3); color: var(--text); }
  .btn-danger { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: var(--red); }
  .btn-danger:hover:not(:disabled) { background: rgba(239,68,68,0.25); }
  .btn-success { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); color: var(--green); }
  .btn-sm { padding: 5px 12px; font-size: 11px; }
  
  .actions-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10,10,15,0.95); backdrop-filter: blur(12px); border-top: 1px solid var(--border); padding: 14px 32px; display: flex; align-items: center; gap: 12px; z-index: 100; }
  .actions-bar .spacer { flex: 1; }
  
  .overall-progress { flex: 1; max-width: 400px; }
  .overall-progress-text { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
  
  /* Results */
  .result-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--surface2); border-radius: 6px; margin-top: 8px; }
  .result-row audio { flex: 1; height: 32px; }
  .result-row .dl-btn { padding: 4px 10px; background: var(--surface3); border: 1px solid var(--border); border-radius: 4px; color: var(--text2); font-size: 11px; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .result-row .dl-btn:hover { color: var(--text); background: var(--border); }
  
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--surface3); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .empty-state { text-align: center; padding: 40px; color: var(--text3); }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 13px; }
  
  .token-bar { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
  .token-bar .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .token-bar .status-dot.connected { background: var(--green); }
  .token-bar .status-dot.disconnected { background: var(--red); }
  .token-bar .status-text { font-size: 12px; color: var(--text2); flex: 1; }
  
  @media (max-width: 640px) {
    .main { padding: 16px; }
    .form-row { grid-template-columns: 1fr; }
    .header { padding: 16px; }
    .actions-bar { padding: 10px 16px; }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>ALBUM GENERATOR</h1>
    <div class="subtitle">Generate up to 20 tracks with full control per song</div>
  </div>
  <div style="display:flex;gap:8px;align-items:center;">
    <button onclick="openAlbumLibrary()" style="padding:6px 14px;border-radius:8px;background:rgba(245,158,11,0.15);color:#f59e0b;border:1px solid rgba(245,158,11,0.3);cursor:pointer;font-size:13px;font-weight:500;transition:all 0.15s;" onmouseenter="this.style.background='rgba(245,158,11,0.25)'" onmouseleave="this.style.background='rgba(245,158,11,0.15)'">&#128451; Album Library</button>
    <a href="/" class="back-btn">Back to HOT-Step</a>
  </div>
</div>

<div class="main" id="app">
  <div class="empty-state" id="loading">
    <div class="spinner" style="width:32px;height:32px;border-width:3px;"></div>
    <p style="margin-top:12px;">Connecting to HOT-Step...</p>
  </div>
</div>

<div class="actions-bar" id="actions-bar" style="display:none;">
  <div class="overall-progress" id="overall-progress-wrap">
    <div class="overall-progress-text" id="overall-text">Ready</div>
    <div class="progress-bar"><div class="progress-fill" id="overall-fill" style="width:0%"></div></div>
  </div>
  <div class="spacer"></div>
  <button class="btn btn-secondary btn-sm" onclick="addTrack()" id="add-track-btn">+ Add Track</button>
  <button class="btn btn-danger btn-sm" onclick="cancelAll()" id="cancel-btn" style="display:none;">Cancel All</button>
  <button class="btn btn-secondary btn-sm" onclick="clearForm()" id="clear-btn" title="Clear all tracks and album info">🗑️ Clear</button>
  <button class="btn btn-primary" onclick="generateAlbum()" id="generate-btn">Generate Album</button>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let TOKEN = null;
let PROVIDERS = [];
let SELECTED_PROVIDER = '';
let SELECTED_MODEL = '';
let ALBUM_TITLE = '';
let ARTIST_NAME = '';
let ALBUM_THEME = '';
let ALBUM_GENRES = [];
let GENRE_DROPDOWN_OPEN = false;
let GENRE_SEARCH = '';
let VOCALIST_GENDER = '';    // '' = not set, 'male', 'female', 'duet'
let ABOUT_GENDER = '';       // '' = not set, 'male', 'female'
let LANGUAGES = [
  {code:'en',name:'English'},{code:'zh',name:'Chinese'},{code:'ja',name:'Japanese'},
  {code:'ko',name:'Korean'},{code:'es',name:'Spanish'},{code:'fr',name:'French'},
  {code:'de',name:'German'},{code:'it',name:'Italian'},{code:'pt',name:'Portuguese'},
  {code:'ru',name:'Russian'},{code:'ar',name:'Arabic'},{code:'hi',name:'Hindi'},
  {code:'tr',name:'Turkish'},{code:'vi',name:'Vietnamese'},{code:'th',name:'Thai'},
  {code:'sv',name:'Swedish'},{code:'pl',name:'Polish'},{code:'nl',name:'Dutch'}
];
let SELECTED_LANG = 'en';
let TRACKS = [];
let GENERATING = false;
let CANCEL_FLAG = false;

// Hierarchical genre taxonomy — same as main page
const GENRE_TAXONOMY = [
  { name: 'Pop', icon: '🎤', genres: ['Pop','Synth-Pop','Electropop','Dance Pop','Dream Pop','Indie Pop','Art Pop','Bubblegum Pop','Teen Pop','Power Pop','Chamber Pop','Baroque Pop','K-Pop','J-Pop','C-Pop','Sophisti-Pop','Hyperpop','City Pop'] },
  { name: 'Rock', icon: '🎸', genres: ['Rock','Alternative Rock','Indie Rock','Classic Rock','Hard Rock','Soft Rock','Progressive Rock','Psychedelic Rock','Post-Rock','Punk Rock','Pop Punk','Garage Rock','Surf Rock','Grunge','Shoegaze','Math Rock','Stoner Rock','Blues Rock','Folk Rock','Post-Punk','Emo','Noise Rock'] },
  { name: 'Electronic', icon: '🎧', genres: ['Electronic','EDM','House','Deep House','Tech House','Progressive House','Techno','Minimal Techno','Trance','Psytrance','Drum and Bass','Dubstep','Future Bass','Ambient','Downtempo','Chillwave','Synthwave','Retrowave','IDM','Breakbeat','Garage','Hardstyle','Electro','Vaporwave','Glitch'] },
  { name: 'Hip-Hop', icon: '🎙️', genres: ['Hip-Hop','Rap','Trap','Lo-Fi Hip-Hop','Boom Bap','Drill','Grime','Cloud Rap','Conscious Hip-Hop','Gangsta Rap','Mumble Rap','Old School Hip-Hop','Phonk','Crunk','Chopped and Screwed'] },
  { name: 'R&B / Soul', icon: '💜', genres: ['R&B','Soul','Neo-Soul','Contemporary R&B','Funk','Disco','Motown','Quiet Storm','New Jack Swing','P-Funk','Afrobeats','Gospel'] },
  { name: 'Metal', icon: '🤘', genres: ['Heavy Metal','Thrash Metal','Death Metal','Black Metal','Doom Metal','Power Metal','Progressive Metal','Symphonic Metal','Nu Metal','Metalcore','Deathcore','Gothic Metal','Sludge Metal','Speed Metal','Folk Metal','Djent','Industrial Metal'] },
  { name: 'Jazz', icon: '🎷', genres: ['Jazz','Smooth Jazz','Bebop','Cool Jazz','Swing','Jazz Fusion','Acid Jazz','Free Jazz','Latin Jazz','Bossa Nova Jazz','Modal Jazz','Gypsy Jazz'] },
  { name: 'Classical', icon: '🎻', genres: ['Classical','Orchestral','Chamber Music','Opera','Baroque','Romantic','Minimalist','Contemporary Classical','Choral','Neoclassical'] },
  { name: 'Country', icon: '🤠', genres: ['Country','Country Pop','Country Rock','Bluegrass','Americana','Honky-Tonk','Outlaw Country','Alt-Country','Country Blues'] },
  { name: 'Folk', icon: '🪕', genres: ['Folk','Indie Folk','Contemporary Folk','Celtic','World Music','Flamenco','Acoustic','Singer-Songwriter','Neofolk','Freak Folk'] },
  { name: 'Blues', icon: '🎵', genres: ['Blues','Delta Blues','Chicago Blues','Electric Blues','Blues Rock','Jump Blues','Rhythm and Blues','Boogie-Woogie'] },
  { name: 'Reggae / Caribbean', icon: '🌴', genres: ['Reggae','Reggae (Patois)','Dancehall','Dancehall (Patois)','Ska','Dub','Dub (Patois)','Roots Reggae','Reggaeton','Soca','Calypso'] },
  { name: 'DJ / Turntablism', icon: '🎧', genres: ['DJ','Dual DJ','Turntablism','Scratch Battle'] },
  { name: 'Latin', icon: '💃', genres: ['Latin','Salsa','Bossa Nova','Bachata','Cumbia','Merengue','Tango','Latin Pop','Mariachi','Norteño'] },
  { name: 'Traditional / World', icon: '🌍', genres: ['Klezmer','Mariachi','Bhangra','Andean'] },
  { name: 'Soundtrack / Cinematic', icon: '🎬', genres: ['Film Score','Epic','Cinematic','Video Game Music','Orchestral Soundtrack','Trailer Music','Dark Ambient','Fantasy','Sci-Fi'] },
  { name: 'Experimental / Other', icon: '🔮', genres: ['Experimental','Avant-Garde','Noise','Industrial','New Age','Meditation','Lo-Fi','Post-Industrial','Art Rock','Drone','Musique Concrète'] },
];
const ALL_GENRES = GENRE_TAXONOMY.flatMap(c => c.genres);

// ── Random Name Generators ──────────────────────────────────────────────
const RANDOM_ADJECTIVES = ['Neon','Midnight','Velvet','Electric','Cosmic','Phantom','Silver','Golden','Crimson','Azure','Obsidian','Crystal','Ethereal','Savage','Lucid','Frozen','Burning','Silent','Wild','Lost'];
const RANDOM_NOUNS = ['Drifter','Pilgrim','Prophet','Wanderer','Voyager','Sentinel','Nomad','Revenant','Oracle','Phoenix','Mirage','Spectre','Echo','Storm','Raven','Hawk','Wolf','Fox','Lynx','Serpent'];
const RANDOM_ALBUM_WORDS = ['Echoes','Horizons','Visions','Chronicles','Reflections','Odyssey','Saga','Requiem','Nocturne','Rhapsody','Labyrinth','Overture','Whispers','Fragments','Parallels','Euphoria','Catharsis','Metamorphosis','Genesis','Renaissance'];

function randomName() {
  const a = RANDOM_ADJECTIVES[Math.floor(Math.random() * RANDOM_ADJECTIVES.length)];
  const n = RANDOM_NOUNS[Math.floor(Math.random() * RANDOM_NOUNS.length)];
  return a + ' ' + n;
}
function randomAlbumTitle() {
  const words = [];
  const len = 2 + Math.floor(Math.random() * 3);
  const pool = [...RANDOM_ALBUM_WORDS];
  for (let i = 0; i < len && pool.length > 0; i++) {
    const idx = Math.floor(Math.random() * pool.length);
    words.push(pool.splice(idx, 1)[0]);
  }
  return words.join(' ');
}
function autoFillArtistName() {
  if (ARTIST_NAME) return; // already set
  const saved = localStorage.getItem('hs-username');
  if (saved) { ARTIST_NAME = saved; return; }
  ARTIST_NAME = randomName();
}
function autoFillAlbumTitle() {
  if (!ALBUM_TITLE) ALBUM_TITLE = randomAlbumTitle();
}
async function randomTheme() {
  if (!SELECTED_PROVIDER || !TOKEN) return alert('Select an LLM provider first');
  const btn = $('theme-random-btn');
  const origText = btn?.innerHTML;
  if (btn) { btn.disabled = true; btn.innerHTML = '⏳'; }
  try {
    const genreContext = ALBUM_GENRES.length > 0
      ? `The album's genre/style is: ${albumGenreDisplay()}.`
      : 'Pick any compelling album concept.';
    const genderContext = buildGenderContext();
    const prompt = `${genreContext}
${genderContext ? genderContext + '\n' : ''}Generate a single, original album theme/concept — one sentence, 10-20 words. It must be a vivid, evocative concept that fits the genre(s). Output ONLY the theme sentence, nothing else. No quotes, no labels, no explanation.`;

    const result = await api('/api/inspire/llm', {
      method: 'POST',
      body: JSON.stringify({
        provider: SELECTED_PROVIDER,
        model: SELECTED_MODEL || undefined,
        genres: ALBUM_GENRES,
        subject: prompt,
        language: SELECTED_LANG,
        systemPrompt: 'You are an expert album concept designer. You produce short, evocative album themes that feel authentic to the genre. Output ONLY the theme text — no labels, no quotes, no extra lines.'
      })
    });
    let theme = (result.lyrics || '').trim();
    // Strip surrounding quotes if present
    theme = theme.replace(/^["'"`]|["'"`]$/g, '').trim();
    // Take only the first line
    theme = theme.split('\n')[0].trim();
    // Remove leading labels like "THEME:" or "Theme:"
    theme = theme.replace(/^THEME\s*:\s*/i, '').trim();
    if (theme) ALBUM_THEME = theme;
    saveConfig();
    render();
  } catch(e) {
    console.error('Random theme failed:', e);
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = origText || '🎲'; }
  }
}

function toggleGenrePicker() {
  GENRE_DROPDOWN_OPEN = !GENRE_DROPDOWN_OPEN;
  GENRE_SEARCH = '';
  render();
  if (GENRE_DROPDOWN_OPEN) {
    setTimeout(() => { const inp = document.getElementById('genre-search-input'); if (inp) inp.focus(); }, 50);
  }
}
function toggleGenre(genre) {
  const idx = ALBUM_GENRES.indexOf(genre);
  if (idx >= 0) ALBUM_GENRES.splice(idx, 1); else ALBUM_GENRES.push(genre);
  saveConfig();
  render();
}
function removeGenre(genre) {
  ALBUM_GENRES = ALBUM_GENRES.filter(g => g !== genre);
  saveConfig();
  render();
}
function clearGenres() {
  ALBUM_GENRES = [];
  saveConfig();
  render();
}
function randomGenres() {
  const count = 2 + Math.floor(Math.random() * 3);
  const shuffled = [...ALL_GENRES].sort(() => Math.random() - 0.5);
  ALBUM_GENRES = shuffled.slice(0, count);
  saveConfig();
  render();
}
function addCustomGenre(val) {
  const v = (val || '').trim();
  if (!v) return;
  if (!ALBUM_GENRES.includes(v)) ALBUM_GENRES.push(v);
  GENRE_SEARCH = '';
  saveConfig();
  render();
  setTimeout(() => { const inp = document.getElementById('genre-search-input'); if (inp) inp.focus(); }, 50);
}
function getFilteredGenreTaxonomy() {
  if (!GENRE_SEARCH.trim()) return GENRE_TAXONOMY;
  const q = GENRE_SEARCH.toLowerCase();
  return GENRE_TAXONOMY.map(c => ({ ...c, genres: c.genres.filter(g => g.toLowerCase().includes(q)) })).filter(c => c.genres.length > 0);
}
function albumGenreDisplay() {
  return ALBUM_GENRES.join(', ');
}
function buildGenderContext() {
  const parts = [];
  if (VOCALIST_GENDER === 'male') parts.push('The singer is MALE. Use masculine pronouns (he/him/his) when the lyrics refer to the vocalist/speaker. Write from a male perspective.');
  else if (VOCALIST_GENDER === 'female') parts.push('The singer is FEMALE. Use feminine pronouns (she/her/hers) when the lyrics refer to the vocalist/speaker. Write from a female perspective.');
  else if (VOCALIST_GENDER === 'duet') parts.push('This is a MALE/FEMALE DUET. Alternate between male and female perspectives. Use he/him for the male voice and she/her for the female voice. Write call-and-response or alternating verse sections.');
  if (ABOUT_GENDER === 'male') parts.push('The subject of the song is MALE. When referring to the person being sung to or about, use masculine pronouns (he/him/his).');
  else if (ABOUT_GENDER === 'female') parts.push('The subject of the song is FEMALE. When referring to the person being sung to or about, use feminine pronouns (she/her/hers).');
  if (parts.length > 0) return '\nGENDER/PERSPECTIVE RULES:\n' + parts.map(p => '- ' + p).join('\n') + '\n';
  return '';
}

// ── Helpers ──────────────────────────────────────────────────────────────
function $(id) { return document.getElementById(id); }
function api(path, opts={}) {
  const h = {'Content-Type':'application/json'};
  if (TOKEN) h['Authorization'] = 'Bearer ' + TOKEN;
  return fetch(path, {...opts, headers: {...h, ...opts.headers}})
    .then(r => r.json().then(d => { if (!r.ok) throw new Error(d.error||r.statusText); return d; }));
}

// ── Init ──────────────────────────────────────────────────────────────────
async function init() {
  try {
    const auth = await api('/api/auth/auto');
    TOKEN = auth.token;
    localStorage.setItem('hs-album-token', TOKEN);
  } catch(e) {
    // Try cached token
    const cached = localStorage.getItem('hs-album-token');
    if (cached) {
      TOKEN = cached;
      try { await api('/api/auth/me'); } catch { TOKEN = null; }
    }
    if (!TOKEN) {
      try {
        const auth = await api('/api/auth/auto');
        TOKEN = auth.token;
        localStorage.setItem('hs-album-token', TOKEN);
      } catch(e2) {
        $('loading').innerHTML = '<div class="empty-state"><p style="color:var(--red)">Cannot connect to HOT-Step server. Make sure it is running.</p></div>';
        return;
      }
    }
  }

  // Fetch providers
  try {
    const provs = await api('/api/inspire/llm/providers');
    PROVIDERS = Array.isArray(provs) ? provs : [];
    // Filter to available providers only
    PROVIDERS = PROVIDERS.filter(p => p.available);
    if (PROVIDERS.length === 0) PROVIDERS = Array.isArray(provs) ? provs : []; // fallback to all if none available
    if (PROVIDERS.length > 0) {
      SELECTED_PROVIDER = PROVIDERS[0].id || PROVIDERS[0].name || '';
      SELECTED_MODEL = PROVIDERS[0].default_model || '';
    }
  } catch(e) { console.warn('Failed to fetch providers:', e); }

  // Load saved album config
  try {
    const saved = JSON.parse(localStorage.getItem('hs-album-config') || '{}');
    ALBUM_TITLE = saved.title || '';
    ARTIST_NAME = saved.artistName || '';
    ALBUM_THEME = saved.theme || '';
    ALBUM_GENRES = Array.isArray(saved.genres) ? saved.genres : (saved.genre ? [saved.genre] : []);
    SELECTED_LANG = saved.lang || 'en';
    VOCALIST_GENDER = saved.vocalistGender || '';
    ABOUT_GENDER = saved.aboutGender || '';
    SELECTED_PROVIDER = saved.provider || SELECTED_PROVIDER;
    SELECTED_MODEL = saved.model || SELECTED_MODEL;
    if (saved.tracks && Array.isArray(saved.tracks)) {
      TRACKS = saved.tracks;
    }
  } catch(e) {}

  // Auto-fill artist name and album title if empty
  autoFillArtistName();
  autoFillAlbumTitle();

  // Validate saved provider against available providers
  if (PROVIDERS.length > 0) {
    const validProvider = PROVIDERS.find(p => (p.id || p.name) === SELECTED_PROVIDER);
    if (!validProvider) {
      // Saved provider not found — reset to first available
      SELECTED_PROVIDER = PROVIDERS[0].id || PROVIDERS[0].name || '';
      SELECTED_MODEL = PROVIDERS[0].default_model || '';
    }
  }

  if (TRACKS.length === 0) {
    for (let i = 0; i < 3; i++) TRACKS.push({subject:'',lyrics:'',title:'',genreOverride:''});
  }

  render();
}

function saveConfig() {
  try {
    localStorage.setItem('hs-album-config', JSON.stringify({
      title: ALBUM_TITLE, artistName: ARTIST_NAME, theme: ALBUM_THEME, genres: ALBUM_GENRES, lang: SELECTED_LANG,
      vocalistGender: VOCALIST_GENDER, aboutGender: ABOUT_GENDER,
      provider: SELECTED_PROVIDER, model: SELECTED_MODEL,
      tracks: TRACKS.map(t => ({
        subject:t.subject,lyrics:t.lyrics,title:t.title,genreOverride:t.genreOverride,
        _bpm:t._bpm,_key:t._key,_duration:t._duration,_timeSignature:t._timeSignature,
        _caption:t._caption
      }))
    }));
  } catch(e) {}
}

function renderTrack(t, i) {

  const isError = t._status === 'error';

  if (isExpanded) cls.push('expanded');
  if (isActive) cls.push('active');
  if (isDone) cls.push('completed');
  if (isError) cls.push('error');
  
  const displayTitle = t.title || t.subject || `Track ${i+1}`;
  const titleCls = (t.title || t.subject) ? 'track-title-display' : 'track-title-display empty';

  let statusHtml = '';
  if (t._status === 'queued') {
    statusHtml = `<div class="track-status queued"><span class="spinner"></span>Queued...</div>`;
  } else if (t._status === 'generating') {
    statusHtml = `<div class="track-status generating"><span class="spinner"></span>${esc(t._stage||'Generating...')}</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${t._progress||0}%"></div></div>`;

      statusHtml += `<div class="result-row">
        <audio controls src="${esc(t._audioUrl)}" style="flex:1;height:32px;"></audio>
        <a class="dl-btn" href="${esc(t._audioUrl)}" download="${esc(t.title||'track-'+(i+1))+'.wav'}">Download</a>
      </div>`;
    }
    if (t._lyrics) {
      statusHtml += `<details style="margin-top:8px;"><summary style="font-size:11px;color:var(--text3);cursor:pointer;">View Generated Lyrics</summary>
        <pre style="font-size:11px;color:var(--text2);margin-top:6px;white-space:pre-wrap;font-family:inherit;background:var(--surface2);padding:8px;border-radius:4px;">${esc(t._lyrics)}</pre></details>`;
    }
  } else if (t._status === 'error') {
    statusHtml = `<div class="track-status error">✗ ${esc(t._error||'Error')}</div>`;
  }

  // Filter out unsupported genres
  const filteredGenres = ALL_GENRES;

  return `<div class="${cls.join(' ')}" id="track-${i}">
    <div class="track-header" onclick="toggleTrack(${i})">
      <div class="track-num">${isDone?'✓':isError?'✗':i+1}</div>

        <div class="form-group">

            oninput="TRACKS[${i}].subject=this.value;saveConfig()" ${GENERATING?'disabled':''}>

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function toggleTrack(i) {
  const wasExpanded = document.getElementById('track-'+i)?.classList.contains('expanded');
  document.querySelectorAll('.track-card').forEach(c => c.classList.remove('expanded'));
  if (!wasExpanded) {
    TRACKS.forEach((t,j) => t._expanded = (j===i));
    document.getElementById('track-'+i)?.classList.add('expanded');
  }
}

const MAX_TRACKS = 20;
function addTrack() {
  if (TRACKS.length >= MAX_TRACKS) return;
  TRACKS.push({subject:'',lyrics:'',title:'',genreOverride:''});
  saveConfig();
  render();
  toggleTrack(TRACKS.length - 1);
  updateAddBtn();
}

function removeTrack(i) {
  if (TRACKS.length <= 1) return;
  if (GENERATING) return;
  TRACKS.splice(i, 1);
  saveConfig();
  render();
  updateAddBtn();
}

function updateAddBtn() {
  var btn = $('add-track-btn');
  if (!btn) return;
  if (TRACKS.length >= MAX_TRACKS) {
    btn.disabled = true;
    btn.textContent = '+ Add Track (max ' + MAX_TRACKS + ')';
  } else {
    btn.disabled = false;
    btn.textContent = '+ Add Track (' + TRACKS.length + '/' + MAX_TRACKS + ')';
  }
}

// ── LLM Response Parser ──────────────────────────────────────────────────────
function parseLLMAlbumResponse(raw) {
  if (!raw) return null;

  // Strategy 1: Try JSON extraction (handles markdown-wrapped JSON too)
  let cleaned = raw.replace(/```(?:json)?\s*([\s\S]*?)\s*```/g, '$1').trim();
  const start = cleaned.indexOf('{');
  const end = cleaned.lastIndexOf('}');
  if (start >= 0 && end > start) {
    try {
      const json = JSON.parse(cleaned.substring(start, end + 1));
      if (json.tracks && Array.isArray(json.tracks)) return json;
      // Handle { theme, title, tracks: [...] } or { album: { tracks: [...] } }
      const tracks = json.tracks || json.album?.tracks || json.songs;
      if (tracks && Array.isArray(tracks) && tracks.length > 0) {
        return { theme: json.theme || json.description || '', title: json.title || json.albumTitle || '', tracks };
      }
    } catch (e) {}
  }

  // Strategy 2: Line-by-line structured parsing (THEME:, TITLE:, N: Track | Subject)
  const tracks = [];
  let theme = '', title = '';
  const lines = cleaned.split('\n').map(l => l.trim()).filter(Boolean);
  for (const line of lines) {
    if (/^THEME:\s*/i.test(line)) { theme = line.replace(/^THEME:\s*/i, '').trim(); continue; }
    if (/^TITLE:\s*/i.test(line)) { title = line.replace(/^TITLE:\s*/i, '').trim(); continue; }
    // Match: "1: Track Name | Description" or "1. Track Name - Description" or "1) Track Name: Description"
    const m = line.match(/^(\d+)[.:)\]\-]\s*(.+)/);
    if (m) {
      const content = m[2];
      const pipeSplit = content.split('|');
      if (pipeSplit.length > 1) tracks.push({ title: pipeSplit[0].trim(), subject: pipeSplit.slice(1).join('|').trim() });
      else {
        // Try splitting on " - " or ": " as alternative separators
        const dashSplit = content.split(/\s*[-–—]\s+/);
        if (dashSplit.length >= 2) tracks.push({ title: dashSplit[0].trim(), subject: dashSplit.slice(1).join(' - ').trim() });
        else tracks.push({ title: '', subject: content.trim() });
      }
    }
  }
  if (tracks.length > 0) return { theme, title, tracks };

  // Strategy 3: Relaxed parsing — look for any numbered or bulleted list items
  const relaxedTracks = [];
  for (const line of lines) {
    // Skip headers/meta
    if (/^(theme|title|album|track|genre|style|tracklist|here|sure|of course|absolutely)/i.test(line)) continue;
    // Match: "- Track Name: Description" or "• Track Name — Description" or just "Track Name: Description"
    const bulletMatch = line.match(/^[\-\*•]\s*(.+)/);
    const numberedMatch = line.match(/^(?:track\s*)?(\d+)[.:)\]]\s*(.+)/i);
    const colonMatch = line.match(/^([A-Z][A-Za-z\s'&\-]+?):\s*(.+)/);
    if (numberedMatch) {
      const content = numberedMatch[2];
      const parts = content.split(/[|:\-–—]/);
      relaxedTracks.push({ title: (parts[0] || '').trim(), subject: (parts.slice(1).join(' ').trim() || parts[0] || '').trim() });
    } else if (bulletMatch) {
      const content = bulletMatch[1];
      const parts = content.split(/[|:\-–—]/);
      relaxedTracks.push({ title: (parts[0] || '').trim(), subject: (parts.slice(1).join(' ').trim() || parts[0] || '').trim() });
    } else if (colonMatch && colonMatch[1].length < 40 && colonMatch[2].length > 10) {
      relaxedTracks.push({ title: colonMatch[1].trim(), subject: colonMatch[2].trim() });
    }
  }
  if (relaxedTracks.length >= 2) return { theme: '', title: '', tracks: relaxedTracks };

  return null;
}

// ── Random Subject ──────────────────────────────────────────────────────
async function generateSubject(i) {
  if (!SELECTED_PROVIDER || !TOKEN) return alert('Select an LLM provider first');
  const track = TRACKS[i];
  const genre = track.genreOverride || albumGenreDisplay() || 'any genre';
  const genderHint = buildGenderContext().trim() || '';
  try {
    const r = await api('/api/inspire/llm/subject', {
      method: 'POST', body: JSON.stringify({provider: SELECTED_PROVIDER, model: SELECTED_MODEL||undefined, genres: ALBUM_GENRES.length > 0 ? ALBUM_GENRES : [genre], subject: genderHint || undefined})
    });
    if (r.subject) {
      track.subject = r.subject;
      saveConfig();
      render();
      toggleTrack(i);
    }
  } catch(e) { alert('Subject generation failed: ' + e.message); }
}

// ── Auto-Fill Album ──────────────────────────────────────────────────────
async function autoFillAlbum() {
  if (!SELECTED_PROVIDER || !TOKEN) return alert('Select an LLM provider first');
  if (ALBUM_GENRES.length === 0) return alert('Select a genre first');

  const btn = $('autofill-btn');
  const shuffleBtn = $('shuffle-btn');
  const origText = btn?.textContent;
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Generating concept...'; }
  if (shuffleBtn) shuffleBtn.disabled = true;

  try {
    const hasTheme = ALBUM_THEME && ALBUM_THEME.trim().length > 0;
    // Count tracks that already have content; if none, fill all 9
    const activeCount = TRACKS.filter(t => t.subject || t.lyrics).length || TRACKS.length;

    let subjectPrompt = `Design a ${activeCount}-track ${albumGenreDisplay()} album`;
    if (hasTheme) subjectPrompt += ` with the concept: "${ALBUM_THEME}"`;
    if (VOCALIST_GENDER) subjectPrompt += `. The vocalist is ${VOCALIST_GENDER}`;
    if (ABOUT_GENDER) subjectPrompt += `. The songs are about a ${ABOUT_GENDER} subject`;
    subjectPrompt += `. Generate ${activeCount} tracks that form a cohesive album.`;

    const genderContext = buildGenderContext();
    const sysPrompt = `You are an expert music producer and album concept designer. You design album track listings with compelling themes and subjects.
${genderContext}
Output your response in this EXACT format — one line per field, no JSON, no markdown, no code blocks:

THEME: A 1-2 sentence album concept/theme description
TITLE: Album title (2-5 words, catchy)
1: Track Title | A 2-3 sentence description of what this song is about — enough detail for a lyricist to write from. Concrete images, specific scenarios, emotional arc.
2: Track Title | A 2-3 sentence description...
3: Track Title | A 2-3 sentence description...
...continue for every track...

CRITICAL RULES:
- EVERY line must start with either "THEME:", "TITLE:", or a number followed by colon.
- Every track subject must be DIFFERENT — no two tracks about the same thing.
- Each subject must contain CONCRETE IMAGES (places, objects, actions, sensory details) — never abstract concepts.
- ${hasTheme
    ? 'The tracks should tell a STORY ARC across the album: Act 1 (tracks 1-2) = Setup — introduce the world/characters. Act 2 (middle tracks) = Conflict/Journey — raise stakes, explore different angles. Final tracks = Resolution — climax, transformation, the final image.'
    : 'Vary the mood, tempo feel, and lyrical themes across tracks. Make each track feel like a distinct chapter — different scene, different emotion, different energy level — but all belonging to the same genre universe.'}
- Titles should be SHORT (1-4 words), evocative, and memorable.
- Never repeat a title word across tracks (e.g. if one track is "Midnight Rain" don't use "rain" in another title).`;

    const result = await api('/api/inspire/llm', {
      method: 'POST',
      body: JSON.stringify({
        provider: SELECTED_PROVIDER,
        model: SELECTED_MODEL || undefined,
        genres: ALBUM_GENRES,
        subject: subjectPrompt,
        language: SELECTED_LANG,
        systemPrompt: sysPrompt
      })
    });

    const raw = result.lyrics || '';
    let concept = parseLLMAlbumResponse(raw);

    // Retry once with a simpler prompt if parsing fails
    if (!concept || !concept.tracks || concept.tracks.length === 0) {
      console.warn('[AutoFill] First parse failed. Raw response:', raw.slice(0, 500));
      if (btn) btn.textContent = '⏳ Retrying with simpler prompt...';

      const retryPrompt = `You are making a ${albumGenreDisplay()} album with ${activeCount} tracks.
${buildGenderContext()}
Return EXACTLY this format, nothing else. Replace the bracketed content:

THEME: [one sentence album concept]
TITLE: [album title]
1: [Track Title] | [2 sentence song description]
2: [Track Title] | [2 sentence song description]
3: [Track Title] | [2 sentence song description]
${Array.from({length: 17}, (_, i) => `${activeCount >= i + 4 ? i + 4 + ': [Track Title] | [2 sentence song description]' : ''}`).filter(Boolean).join('\n')}
Do NOT add any other text, explanations, or formatting. ONLY output the lines above with the brackets replaced.`;

      try {
        const retryResult = await api('/api/inspire/llm', {
          method: 'POST',
          body: JSON.stringify({
            provider: SELECTED_PROVIDER,
            model: SELECTED_MODEL || undefined,
            genres: ALBUM_GENRES,
            subject: `Design a ${albumGenreDisplay()} album concept with ${activeCount} different tracks`,
            language: SELECTED_LANG,
            systemPrompt: retryPrompt
          })
        });
        const retryRaw = retryResult.lyrics || '';
        concept = parseLLMAlbumResponse(retryRaw);
        if (!concept || !concept.tracks || concept.tracks.length === 0) {
          console.error('[AutoFill] Retry also failed. Raw:', retryRaw.slice(0, 500));
          throw new Error('Could not parse album concept after 2 attempts. Try a different provider/model, or fill tracks manually.');
        }
      } catch (retryErr) {
        if (retryErr.message.includes('Could not parse')) throw retryErr;
        // LLM call itself failed on retry
        throw new Error('LLM failed: ' + retryErr.message + '. Try a different provider or model.');
      }
    }

    if (concept.theme) ALBUM_THEME = concept.theme;
    if (concept.title && !ALBUM_TITLE) ALBUM_TITLE = concept.title;
    if (!ARTIST_NAME) ARTIST_NAME = randomName();

    const numToFill = Math.min(concept.tracks.length, TRACKS.length);
    for (let i = 0; i < numToFill; i++) {
      const t = concept.tracks[i];
      if (t.title) TRACKS[i].title = t.title;
      if (t.subject) TRACKS[i].subject = t.subject;
      TRACKS[i].lyrics = '';
      TRACKS[i]._expanded = false;
    }

    saveConfig();
    render();
    toggleTrack(0);

  } catch(e) {
    const msg = e.message || String(e);
    let hint = '';
    if (msg.includes('Unknown LLM provider')) {
      hint = '\n\nTip: The provider name must match a registered provider. Check the LLM Provider dropdown.';
    } else if (msg.includes('fetch') || msg.includes('network') || msg.includes('ECONNREFUSED')) {
      hint = '\n\nTip: Make sure the LLM server is running and accessible.';
    } else if (msg.includes('timed out') || msg.includes('timeout')) {
      hint = '\n\nTip: The LLM took too long. Try a faster model or check your connection.';
    } else if (msg.includes('Could not parse')) {
      hint = '\n\nTip: The LLM returned content in an unexpected format. Try a different model (larger models follow instructions better), or fill tracks manually.';
    }
    alert('Auto-fill failed: ' + msg + hint);
    console.error('Auto-fill error:', e);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = origText || '✨ Auto-Fill Album'; }
    if (shuffleBtn) shuffleBtn.disabled = false;
  }
}

// ── Shuffle Tracks (re-roll subjects, keep theme) ───────────────────────
async function shuffleTracks() {
  if (!SELECTED_PROVIDER || !TOKEN) return alert('Select an LLM provider first');
  if (ALBUM_GENRES.length === 0) return alert('Select a genre first');

  const hasAnyContent = TRACKS.some(t => t.subject || t.lyrics);
  if (!hasAnyContent) return autoFillAlbum(); // nothing to shuffle — do full auto-fill instead

  const btn = $('shuffle-btn');
  const autoBtn = $('autofill-btn');
  const origText = btn?.textContent;
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Shuffling...'; }
  if (autoBtn) autoBtn.disabled = true;

  try {
    const activeCount = TRACKS.filter(t => t.subject || t.lyrics).length || TRACKS.length;
    const hasTheme = ALBUM_THEME && ALBUM_THEME.trim().length > 0;

    // Build a compact summary of current state so LLM knows what to replace
    const currentSummary = TRACKS.filter(t => t.subject || t.title)
      .map((t, idx) => `${idx+1}. "${t.title || '(no title)'}" — ${(t.subject||'').substring(0, 120)}`)
      .join('\n');

    let subjectPrompt = `Replace the track subjects for a ${activeCount}-track ${albumGenreDisplay()} album`;
    if (hasTheme) subjectPrompt += ` with theme: "${ALBUM_THEME}"`;
    if (VOCALIST_GENDER) subjectPrompt += `. The vocalist is ${VOCALIST_GENDER}`;
    if (ABOUT_GENDER) subjectPrompt += `. The songs are about a ${ABOUT_GENDER} subject`;
    subjectPrompt += `. Current tracks:\n${currentSummary}\n\nGenerate completely NEW subjects and (optionally better) titles. Keep the album cohesive but make every track feel fresh — different scene, emotion, and energy.`;

    const genderCtx = buildGenderContext();
    const sysPrompt = `You are an expert music producer shuffling an album's track listing.
${genderCtx}
Output your response in this EXACT format — one line per field:

1: New Title | A 2-3 sentence description — concrete images, specific scenarios, emotional arc. Enough for a lyricist to write from.
2: New Title | A 2-3 sentence description...
...continue for every track...

RULES:
- EVERY line must start with a number followed by colon.
- Every track must be DISTINCT from the others.
- Subjects must contain CONCRETE IMAGES — never abstract concepts.
- Titles must be SHORT and evocative.
- Don't repeat title words across tracks.`;

    const result = await api('/api/inspire/llm', {
      method: 'POST',
      body: JSON.stringify({
        provider: SELECTED_PROVIDER,
        model: SELECTED_MODEL || undefined,
        genres: ALBUM_GENRES,
        subject: subjectPrompt,
        language: SELECTED_LANG,
        systemPrompt: sysPrompt
      })
    });

    const raw = result.lyrics || '';
    const concept = parseLLMAlbumResponse(raw);

    if (!concept || !concept.tracks || !Array.isArray(concept.tracks)) {
      console.error('[Shuffle] All parse strategies failed. Raw:', raw);
      throw new Error('Could not parse shuffled tracks. Check the browser console (F12) for the raw LLM response.');
    }

    const numToFill = Math.min(concept.tracks.length, TRACKS.length);
    for (let i = 0; i < numToFill; i++) {
      const t = concept.tracks[i];
      if (t.title) TRACKS[i].title = t.title;
      if (t.subject) TRACKS[i].subject = t.subject;
      TRACKS[i].lyrics = '';
      TRACKS[i]._expanded = false;
    }

    saveConfig();
    render();
    toggleTrack(0);

  } catch(e) {
    alert('Shuffle failed: ' + e.message);
    console.error('Shuffle error:', e);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = origText || '🎲 Shuffle Tracks'; }
    if (autoBtn) autoBtn.disabled = false;
  }
}

// ── Generate Album ──────────────────────────────────────────────────────
// Phase 1: Generate lyrics for all tracks (prompt management — this is the Album Creator's job)
// Phase 2: Save completed track list and hand off to main page for audio generation
async function generateAlbum() {
  if (GENERATING) return;

  // Validate
  const activeTracks = TRACKS.filter(t => t.subject || t.lyrics);
  if (activeTracks.length === 0) return alert('Configure at least one track with a subject or lyrics.');
  if (!SELECTED_PROVIDER) return alert('Select an LLM provider first.');

  GENERATING = true;
  CANCEL_FLAG = false;
  $('generate-btn').disabled = true;
  $('cancel-btn').style.display = '';
  $('add-track-btn').disabled = true;
  updateOverall();

  let lyricsFailed = false;

  // ── PHASE 1: Generate lyrics for all tracks (prompt management) ──
  for (let i = 0; i < TRACKS.length; i++) {
    const t = TRACKS[i];
    if (!t.subject && !t.lyrics) continue;
    if (CANCEL_FLAG) break;

    toggleTrack(i);

    try {
      // Generate lyrics via LLM if not already provided
      if (!t.lyrics) {
        t._status = 'generating';
        t._stage = 'Generating lyrics via LLM...';
        t._progress = 0;
        render();
        toggleTrack(i);

        const genres = t.genreOverride ? [t.genreOverride] : (ALBUM_GENRES.length > 0 ? [...ALBUM_GENRES] : ['Rock']);
        let subjectWithTheme = ALBUM_THEME
          ? (t.subject ? `${t.subject} (Album theme: ${ALBUM_THEME})` : ALBUM_THEME)
          : t.subject;
        // Inject gender context into the subject so LLM writes correct pronouns
        const genderBits = [];
        if (VOCALIST_GENDER === 'male') genderBits.push('Sung by a MALE vocalist (use he/him for the speaker)');
        else if (VOCALIST_GENDER === 'female') genderBits.push('Sung by a FEMALE vocalist (use she/her for the speaker)');
        else if (VOCALIST_GENDER === 'duet') genderBits.push('MALE/FEMALE DUET — alternate male and female perspectives with correct pronouns');
        if (ABOUT_GENDER === 'male') genderBits.push('About a MALE subject (use he/him when referring to the person being sung to/about)');
        else if (ABOUT_GENDER === 'female') genderBits.push('About a FEMALE subject (use she/her when referring to the person being sung to/about)');
        if (genderBits.length > 0) subjectWithTheme = `[${genderBits.join('; ')}] ${subjectWithTheme}`;

        // Retry loop: try up to 2 times if LLM returns empty/poor lyrics
        let llmResult = null;
        let lyricsValid = false;
        for (let attempt = 1; attempt <= 2; attempt++) {
          try {
            llmResult = await api('/api/inspire/llm', {
              method: 'POST',
              body: JSON.stringify({
                provider: SELECTED_PROVIDER,
                model: SELECTED_MODEL || undefined,
                genres: genres,
                subject: subjectWithTheme,
                language: SELECTED_LANG
              })
            });
          } catch (llmErr) {
            console.error(`Track ${i+1} LLM call failed (attempt ${attempt}):`, llmErr.message);
            if (attempt === 1) {
              t._stage = `LLM error, retrying... (${llmErr.message})`;
              render();
              toggleTrack(i);
              await sleep(2000);
              continue;
            }
            throw new Error(`LLM provider failed: ${llmErr.message}. Check your provider settings and model.`);
          }

          const rawLyrics = (llmResult.lyrics || '').trim();
          const sectionCount = (rawLyrics.match(/\[[\w\s\d]+\]/gi) || []).length;
          const lineCount = rawLyrics.split('\n').filter(l => l.trim() && !l.trim().match(/^\[[\w\s\d]+\]$/)).length;
          const wordCount = rawLyrics.split(/\s+/).filter(w => w.length > 0).length;

          if (rawLyrics.length > 50 && sectionCount >= 2 && lineCount >= 8 && wordCount >= 30) {
            lyricsValid = true;
            break;
          }

          console.warn(`Track ${i+1} lyrics too sparse (attempt ${attempt}): ${sectionCount} sections, ${lineCount} lines, ${wordCount} words`);
          if (attempt === 1) {
            t._stage = 'Lyrics too sparse, retrying with simpler prompt...';
            render();
            toggleTrack(i);
            await sleep(1000);
          }
        }

        if (!lyricsValid || !llmResult) {
          throw new Error('LLM returned empty or unreadable lyrics. Try a different provider/model, or write lyrics manually.');
        }

        t.lyrics = llmResult.lyrics || '';
        t.title = t.title || llmResult.title || '';
        t._caption = llmResult.caption || genres.join(', ');
        t._bpm = llmResult.bpm;
        t._key = llmResult.key;
        t._duration = llmResult.duration;
        t._timeSignature = llmResult.timeSignature;
      }

      // Validate lyrics quality
      const finalLyricCheck = (t.lyrics || '').trim();
      if (finalLyricCheck.length < 30 || (finalLyricCheck.match(/\[[\w\s\d]+\]/gi) || []).length < 2) {
        throw new Error('Lyrics are too short or missing section headers.');
      }

      t._status = 'ready';
      t._stage = 'Lyrics ready';
      t._progress = 100;
      render();
      toggleTrack(i);

    } catch(e) {
      t._status = 'error';
      t._error = e.message;
      t._stage = 'Failed: ' + e.message;
      render();
      toggleTrack(i);
      console.error(`Track ${i+1} failed:`, e);
      lyricsFailed = true;
    }
  }

  if (CANCEL_FLAG || lyricsFailed) {
    GENERATING = false;
    CANCEL_FLAG = false;
    $('generate-btn').disabled = false;
    $('cancel-btn').style.display = 'none';
    $('add-track-btn').disabled = false;
    updateOverall();
    if (lyricsFailed) alert('Some tracks failed lyric generation. Fix errors and try again.');
    return;
  }

  // ── PHASE 2: Save track list and hand off to main page ──
  // The Album Creator is a PROMPT MANAGER. It creates the data and hands
  // it to the main page's existing generation pipeline. Zero duplication.
  const pendingTracks = [];
  for (const t of TRACKS) {
    if (!t.lyrics) continue;
    const trackGenre = t.genreOverride || albumGenreDisplay() || 'Rock';
    const lyricsPreview = (t.lyrics || '').split('\n')
      .filter(l => l.trim() && !l.trim().startsWith('['))
      .slice(0, 6).join(' / ');
    const captionParts = [
      `${trackGenre} song`,
      t.title ? `titled "${t.title}"` : '',
      t.subject ? `about ${t.subject}` : '',
      VOCALIST_GENDER === 'male' ? 'male vocalist' : VOCALIST_GENDER === 'female' ? 'female vocalist' : VOCALIST_GENDER === 'duet' ? 'male and female duet' : '',
      ABOUT_GENDER === 'male' ? 'about a man' : ABOUT_GENDER === 'female' ? 'about a woman' : '',
      t._bpm ? `BPM: ${t._bpm}` : '',
      t._key ? `Key: ${t._key}` : '',
      t._timeSignature ? `Time: ${t._timeSignature}` : '',
      lyricsPreview ? `Lyrics theme: ${lyricsPreview}` : '',
    ].filter(Boolean);
    pendingTracks.push({
      title: t.title || t.subject || `Track`,
      lyrics: t.lyrics,
      caption: captionParts.join('. ') + '.',
      bpm: t._bpm || undefined,
      duration: t._duration || 180,
      keyScale: t._key || undefined,
      timeSignature: t._timeSignature || undefined,
      vocalLanguage: SELECTED_LANG,
      artistName: ARTIST_NAME || undefined,
      albumTitle: ALBUM_TITLE || undefined,
      albumGenre: albumGenreDisplay() || undefined,
      trackIndex: pendingTracks.length + 1,
    });
  }

  localStorage.setItem('hs-album-pending', JSON.stringify(pendingTracks));
  console.log(`[Album] Saved ${pendingTracks.length} tracks to localStorage. Redirecting to main page for audio generation.`);
  window.location.href = '/';
}

function cancelAll() {
  CANCEL_FLAG = true;
}

function clearForm() {
  if (GENERATING) return alert('Cannot clear while generating. Cancel first.');
  if (!confirm('Clear all album info and tracks? This cannot be undone.')) return;
  ALBUM_TITLE = '';
  ARTIST_NAME = '';
  ALBUM_THEME = '';
  ALBUM_GENRES = [];
  SELECTED_LANG = 'en';
  VOCALIST_GENDER = '';
  ABOUT_GENDER = '';
  TRACKS = [];
  for (let i = 0; i < 3; i++) TRACKS.push({subject:'',lyrics:'',title:'',genreOverride:''});
  localStorage.removeItem('hs-album-config');
  saveConfig();
  autoFillArtistName();
  autoFillAlbumTitle();
  render();
}

function updateOverall() {
  const total = TRACKS.filter(t => t.subject || t.lyrics).length;
  const done = TRACKS.filter(t => t._status === 'completed').length;
  const err = TRACKS.filter(t => t._status === 'error').length;
  const active = TRACKS.filter(t => t._status === 'generating' || t._status === 'queued').length;

  let text = 'Ready';
  let pct = 0;

  if (GENERATING) {
    if (total > 0) {
      pct = Math.round((done / total) * 100);
      text = `Track ${done + (active > 0 ? 1 : 0)} of ${total} — ${done} complete${err > 0 ? ', ' + err + ' failed' : ''}`;
    }
  } else if (done > 0 || err > 0) {
    text = `Done — ${done} complete, ${err} failed, ${total - done - err} skipped`;
    pct = total > 0 ? Math.round((done / total) * 100) : 0;
  }

  const ot = $('overall-text');
  const of = $('overall-fill');
  if (ot) ot.textContent = text;
  if (of) of.style.width = pct + '%';
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── Album Library Modal ─────────────────────────────────────────────
async function openAlbumLibrary() {
  /* Get auth token */
  var token = null;
  try {
    var r = await fetch('/api/auth/auto');
    var d = await r.json();
    if (d && d.token) token = d.token;
  } catch(e) {}
  if (!token) {
    var keys = ['ace-settings','hs-auth','hs-token','auth-token'];
    for (var i = 0; i < keys.length; i++) {
      try {
        var raw = localStorage.getItem(keys[i]);
        if (!raw) continue;
        var obj = JSON.parse(raw);
        if (obj && obj.token) { token = obj.token; break; }
      } catch(ex) {}
    }
  }
  var headers = {};
  if (token) headers['Authorization'] = 'Bearer ' + token;

  /* Create modal overlay */
  var overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:10000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);';

  var modal = document.createElement('div');
  modal.style.cssText = 'width:min(720px,92vw);max-height:80vh;background:#1a1a2e;border:1px solid rgba(255,255,255,0.1);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;color:#e4e4e7;font-family:system-ui,-apple-system,sans-serif;';

  /* Header */
  var hdr = document.createElement('div');
  hdr.style.cssText = 'padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between;';
  hdr.innerHTML = '<span style="font-size:18px;font-weight:700;">&#128451; Album Library</span>';
  var closeBtn = document.createElement('button');
  closeBtn.textContent = '\u2715';
  closeBtn.style.cssText = 'background:none;border:none;color:#a1a1aa;font-size:18px;cursor:pointer;padding:4px 8px;border-radius:6px;';
  closeBtn.onclick = function() { overlay.remove(); };
  hdr.appendChild(closeBtn);
  modal.appendChild(hdr);

  /* Body */
  var body = document.createElement('div');
  body.style.cssText = 'flex:1;overflow-y:auto;padding:12px 16px;min-height:200px;';
  body.innerHTML = '<div style="text-align:center;padding:40px;color:#71717a;">Loading albums...</div>';
  modal.appendChild(body);
  overlay.appendChild(modal);
  overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
  document.body.appendChild(overlay);

  /* Load albums */
  try {
    var resp = await fetch('/api/songs/albums', { headers: headers });
    if (!resp.ok) { body.innerHTML = '<div style="text-align:center;padding:40px;color:#ef4444;">Failed to load: HTTP ' + resp.status + '</div>'; return; }
    var data = await resp.json();
    var albums = data.albums || [];
    if (albums.length === 0) {
      body.innerHTML = '<div style="text-align:center;padding:40px;color:#71717a;">No albums found.</div>';
      return;
    }
    body.innerHTML = '';
    albums.forEach(function(album) {
      var card = document.createElement('div');
      card.style.cssText = 'background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:14px 16px;margin-bottom:10px;';
      var row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:12px;';
      var cover = document.createElement('div');
      cover.style.cssText = 'width:48px;height:48px;border-radius:8px;background:linear-gradient(135deg,#7c3aed,#ec4899);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden;';
      if (album.coverUrl) cover.innerHTML = '<img src="' + album.coverUrl.replace(/"/g, '&quot;') + '" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentElement.innerHTML=\'\u266B\'">';
      else cover.textContent = '\u266B';
      var info = document.createElement('div');
      info.style.cssText = 'flex:1;min-width:0;';
      info.innerHTML = '<div style="font-weight:600;font-size:14px;">' + (album.name || 'Untitled') + '</div><div style="font-size:12px;color:#a1a1aa;margin-top:2px;">' + (album.artist || 'Unknown') + ' \u00B7 ' + album.songs.length + ' tracks</div>';
      var dlBtn = document.createElement('button');
      dlBtn.textContent = '\uD83D\uDCE6';
      dlBtn.title = 'Download ZIP';
      dlBtn.style.cssText = 'width:32px;height:32px;border-radius:8px;border:none;background:rgba(168,85,247,0.15);color:#a78bfa;font-size:14px;cursor:pointer;';
      dlBtn.onclick = function(e) {
        e.stopPropagation();
        /* Trigger ZIP download */
        fetch('/api/inspire/album/download-zip', {
          method: 'POST', headers: Object.assign({'Content-Type':'application/json'}, headers),
          body: JSON.stringify({ albumName: album.name })
        }).then(function(r) { return r.json(); }).then(function(d) {
          if (d.zipUrl) window.open(d.zipUrl, '_blank');
        }).catch(function() {});
      };
      row.appendChild(cover); row.appendChild(info); row.appendChild(dlBtn);
      card.appendChild(row);

      /* Track list */
      var tracks = document.createElement('div');
      tracks.style.cssText = 'margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.06);display:none;';
      var showTracks = false;
      var chevron = document.createElement('span');
      chevron.textContent = ' \u25BE';
      chevron.style.cssText = 'color:#71717a;font-size:12px;cursor:pointer;';
      info.appendChild(chevron);
      chevron.onclick = function(e) {
        e.stopPropagation();
        showTracks = !showTracks;
        tracks.style.display = showTracks ? 'block' : 'none';
        chevron.textContent = showTracks ? ' \u25B4' : ' \u25BE';
      };
      card.onclick = function() { chevron.click(); };
      album.songs.forEach(function(song, idx) {
        var tr = document.createElement('div');
        tr.style.cssText = 'display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;font-size:13px;';
        tr.innerHTML = '<span style="color:#71717a;width:20px;text-align:right;">' + String(idx+1).padStart(2,'0') + '</span><span style="flex:1;">' + (song.title||'Untitled') + '</span><span style="color:#71717a;font-size:11px;">' + (song.duration ? Math.floor(song.duration/60)+':'+String(Math.floor(song.duration%60)).padStart(2,'0') : '') + '</span>';
        tracks.appendChild(tr);
      });
      card.appendChild(tracks);
      body.appendChild(card);
    });
  } catch(err) {
    body.innerHTML = '<div style="text-align:center;padding:40px;color:#ef4444;">Error: ' + err.message + '</div>';
  }
}

// ── Start ──────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
