        function logSettings(label, s) {

            ' scheduler=' + (s.scheduler || '(default)') +
            ' guidance=' + (s.guidanceMode || s.guidanceScale || '(default)') +

        function tryLoadTemplate() {
          /* Priority 1: Just captured this session */
          if (window.__abCapturedParams) {
            console.log('[AlbumBatch] Using just-captured params from this session');
            logSettings('Captured', window.__abCapturedParams);
            templateReady = true;
            render();
            return;
          }

          /* Priority 2: Saved template from previous session — ONLY if it has _src marker.
             _src:'mp' = captured from monkey-patch (most accurate)
             _src:'ls' = reconstructed from hs-* localStorage keys (also accurate)
             No _src = stale template from v1/v2 handler — discard it. */

            var saved = localStorage.getItem('hs-album-params-template');
            if (saved) {
              var parsed = JSON.parse(saved);
              if (parsed && typeof parsed === 'object' && (parsed._src === 'mp' || parsed._src === 'ls')) {
                console.log('[AlbumBatch] Using saved params template from localStorage (_src=' + parsed._src + ')');
                console.log('[AlbumBatch] Saved at: ' + (parsed._capturedAt ? new Date(parsed._capturedAt).toISOString() : 'unknown'));
                logSettings('Saved', parsed);
                templateReady = true;
                render();
                return;
              } else if (parsed && !parsed._src) {
                console.warn('[AlbumBatch] Discarding stale template (no _src marker)');
                localStorage.removeItem('hs-album-params-template');
              }
            }
          } catch(e) {}

          /* Priority 3: Read directly from hs-* localStorage keys.

             We replicate the getGlobalParams() logic from the React bundle to reconstruct
             the exact same params object the React app would send. */

              logSettings('FromStorage', storage);

          console.warn('[AlbumBatch] Please configure your settings on the main page first.');

        /* Get the params for a track. ONLY uses captured params — never invents settings. */

            var toSave = JSON.parse(JSON.stringify(base));

            console.log('[AlbumBatch] Using just-captured params, saved to localStorage with _src:mp marker');

        async function startGeneration() {

          generating = true;
          cancelled = false;

          /* NOW we can safely remove hs-album-pending since we're actually generating */
          localStorage.removeItem('hs-album-pending');
          render();

          console.log('[AlbumBatch] Starting generation of ' + tracks.length + ' tracks via API-direct');

          for (var i = 0; i < tracks.length; i++) {
            if (cancelled) break;

            try {

              console.log('[AlbumBatch] Track ' + (i+1) + ': POST /api/generate — source=' + params.source +
                ' inferMethod=' + params.inferMethod + ' scheduler=' + params.scheduler +
                ' guidanceMode=' + params.guidanceMode + ' guidanceScale=' + params.guidanceScale +

        /* Download all completed tracks as a ZIP file with folder structure:

        async function downloadAlbumZip() {
          if (!window.JSZip) { alert('ZIP library is still loading. Please wait a moment and try again.'); return; }
          var doneTracks = tracks.filter(function(t) { return t._status === 'done' && t._audioUrl; });
          if (doneTracks.length === 0) { alert('No completed tracks to download.'); return; }

          var hasVideos = doneTracks.some(function(t) { return t._videoUrl; });
          var zipBtn = document.getElementById('ab-download-zip');

          try {

            var folder = zip.folder(albumArtist).folder(albumTitle);

            /* Add metadata.txt */
