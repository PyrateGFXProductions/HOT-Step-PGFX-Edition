    <!-- Visualizer Floating Button — opens in new tab (iframes block autoplay) -->
    <script>
      (function() {
        var vizHref = '/visualizer.html';
        var currentSongId = null;
        var currentSongTitle = '';
        var vizTab = null;

        /* Extract song ID from audio src pattern: /api/songs/{id}/audio */
        function extractSongId(src) {
          if (!src) return null;
          var m = src.match(/\/api\/songs\/([^/]+)\/audio/);
          return m ? decodeURIComponent(m[1]) : null;
        }

        /* Watch for audio elements and src changes */
        function watchAudio() {
          var audios = document.querySelectorAll('audio');
          audios.forEach(function(a) {
            if (a._vizWatched) return;
            a._vizWatched = true;
            function onSrc() {
              var id = extractSongId(a.src || a.currentSrc);
              if (id) {
                currentSongId = id;
                var titleEl = a.closest('[class*="player"]')?.querySelector('[class*="title"]')
                  || document.querySelector('[class*="song-title"]')
                  || document.querySelector('[class*="track-name"]');
                currentSongTitle = titleEl ? titleEl.textContent.trim() : '';
                vizHref = '/visualizer.html?id=' + encodeURIComponent(id)
                  + (currentSongTitle ? '&title=' + encodeURIComponent(currentSongTitle) : '');
                btn2.style.boxShadow = '0 4px 14px rgba(6,182,212,0.6)';
                btn2.title = 'Visualize: ' + (currentSongTitle || id);
              }
            }
            a.addEventListener('play', function() { onSrc(); });
            a.addEventListener('loadeddata', onSrc);
            if (a.src) onSrc();
          });
        }

        /* Create Floating Action Button */
        var btn2 = document.createElement('a');
        btn2.href = 'javascript:void(0)';
        btn2.title = 'Visualizer — click to open visualizer in new tab';
        btn2.textContent = '🎛️';
        btn2.style.cssText = 'position:fixed;bottom:112px;right:16px;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#0891b2,#06b6d4);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;text-decoration:none;z-index:9999;box-shadow:0 4px 14px rgba(6,182,212,0.4);transition:all 0.2s;cursor:pointer;';
        btn2.onmouseenter = function() { this.style.transform = 'scale(1.1)'; this.style.boxShadow = '0 6px 20px rgba(6,182,212,0.6)'; };
        btn2.onmouseleave = function() { this.style.transform = 'scale(1)'; this.style.boxShadow = '0 4px 14px rgba(6,182,212,0.4)'; };
        btn2.onclick = function(e) {
          e.preventDefault();
          watchAudio();
          /* Build URL with song ID if available */
          var href = currentSongId
            ? '/visualizer.html?id=' + encodeURIComponent(currentSongId) + (currentSongTitle ? '&title=' + encodeURIComponent(currentSongTitle) : '')
            : '/visualizer.html';
          /* Try to reuse existing tab, otherwise open new */
          if (vizTab && !vizTab.closed) {
            vizTab.location.href = href;
            vizTab.focus();
          } else {
            vizTab = window.open(href, 'hotstep-visualizer');
          }
        };
        document.body.appendChild(btn2);

        /* Poll for audio elements */
        setInterval(watchAudio, 2000);
        if (typeof MutationObserver !== 'undefined') {
          var obs = new MutationObserver(function() { setTimeout(watchAudio, 500); });
          obs.observe(document.body, { childList: true, subtree: true });
        }
      })();
    </script>

    <!-- Album Batch: Monkey-patch fetch to capture jobIds from POST /api/generate.
         This runs BEFORE React loads so we intercept ALL generation requests. -->
    <script>
      (function() {
        var _origFetch = window.fetch;
        window.__abPendingJobId = null;
        window.__abCapturedParams = null;
        window.fetch = function() {
          var url = arguments[0];
          var opts = arguments[1] || {};
          var method = opts.method || 'GET';
          var isGenerate = method === 'POST' && typeof url === 'string' && url.indexOf('/api/generate') !== -1;
          if (isGenerate) {
            try { window.__abCapturedParams = JSON.parse(opts.body); } catch(e) {}
            var chain = _origFetch.apply(this, arguments);
            var clonedResp = chain.then(function(resp) {
              var c = resp.clone();
              c.json().then(function(data) {
                if (data && data.jobId) { window.__abPendingJobId = data.jobId; }
              }).catch(function(){});
              return resp;
            });
            return chain;
          }
          return _origFetch.apply(this, arguments);
        };
      })();
    </script>
    <!-- Album Batch Handler v3 — Reads user's pipeline settings from multiple sources.
         Priority: monkey-patch capture > saved template > hs-* localStorage keys.
         NO server defaults, NO applyQualityDefaults fallback, NO guessing.
         Only prompt fields (caption, lyrics, title, etc.) are overridden per track. -->
    <script>
      (function() {
        var raw = localStorage.getItem('hs-album-pending');
        if (!raw) return;
        var tracks;
        try { tracks = JSON.parse(raw); } catch(e) { return; }
        if (!Array.isArray(tracks) || tracks.length === 0) return;
        /* Extract album metadata from first track that has it */
        var albumArtist = '';
        var albumTitle = '';
        var albumGenre = '';
        for (var k = 0; k < tracks.length; k++) {
          if (tracks[k].artistName) albumArtist = tracks[k].artistName;
          if (tracks[k].albumTitle) albumTitle = tracks[k].albumTitle;
          if (tracks[k].albumGenre) albumGenre = tracks[k].albumGenre;
          if (albumArtist && albumTitle && albumGenre) break;
        }
        if (!albumArtist) albumArtist = 'Unknown Artist';
        if (!albumTitle) albumTitle = 'Unknown Album';
        /* DO NOT remove hs-album-pending until generation actually starts.
           This way if there's no template, the panel reappears on next page load. */

        /* === IMMEDIATELY invalidate stale templates from v1/v2 era ===
           Old handlers saved templates WITHOUT the _src:'mp' marker.
           Those templates contain dpm2m/apg/sgm_uniform from /api/generate/defaults.
           We MUST clear them so they don't get loaded. */
        try {
          var old = localStorage.getItem('hs-album-params-template');
          if (old) {
            var parsed = JSON.parse(old);
            if (!parsed || (!parsed._src)) {
              console.warn('[AlbumBatch] Clearing STALE params template (no _src marker — from v1/v2 handler)');
              localStorage.removeItem('hs-album-params-template');
            }
          }
        } catch(e) {}

        /* Build floating panel */
        var panel = document.createElement('div');
        panel.id = 'album-batch-panel';
        panel.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:440px;max-height:80vh;overflow-y:auto;background:#18181b;border:1px solid rgba(168,85,247,0.3);border-radius:16px;box-shadow:0 25px 60px rgba(0,0,0,0.7);z-index:100000;padding:24px;font-family:system-ui,sans-serif;color:#e4e4e7;';
        document.body.appendChild(panel);

        /* Backdrop — click to dismiss */
        var backdrop = document.createElement('div');
        backdrop.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:99999;cursor:pointer;';
        backdrop.onclick = function() { if (!generating) { panel.remove(); backdrop.remove(); } };
        document.body.appendChild(backdrop);

        var TOKEN = localStorage.getItem('hs-album-token') || '';
        var generating = false;
        var cancelled = false;
        var templateReady = false;

        function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

        /* Load JSZip for zip download */

          script.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
          script.onload = function() { console.log('[AlbumBatch] JSZip loaded'); };
          document.head.appendChild(script);
        }

        function render() {
          var done = tracks.filter(function(t) { return t._status === 'done'; }).length;
          var err = tracks.filter(function(t) { return t._status === 'error'; }).length;

                },
                body: JSON.stringify(params)
              });

              if (!resp.ok) {
                var errData = await resp.json().catch(function() { return {}; });
                throw new Error(errData.error || 'Generation request failed (' + resp.status + ')');
              }

              var jobData = await resp.json();
              var jobId = jobData.jobId;
              if (!jobId) throw new Error('No jobId returned from server');

              t._jobId = jobId;
              t._stage = 'Queued...';
              render();
              console.log('[AlbumBatch] Track ' + (i+1) + ': jobId=' + jobId);

              /* Poll for completion */
              t._stage = 'Generating...';
              render();

              var result = await pollJob(jobId);
              t._audioUrl = (result.result && result.result.audioUrls && result.result.audioUrls[0]) || '';
              t._masteredUrl = (result.result && result.result.masteredAudioUrl) || '';
              t._status = 'done';
              t._stage = 'Audio complete';
              render();
              console.log('[AlbumBatch] Track ' + (i+1) + ' audio complete: ' + (t.title || 'Untitled'));

              /* ── VIDEO GENERATION: split lyrics → generate images → render video ── */
              try {
                var trackLyrics = t.lyrics || '';
                if (trackLyrics.length > 50) {
                  /* Split lyrics into sections by [Section] headers */
                  var sections = splitLyricsIntoSections(trackLyrics, t.title);
                  if (sections.length > 0) {
                    t._stage = 'Generating images (' + sections.length + ')...';
                    render();

                    /* Generate images for each section */
                    var imgResp = await fetch('/api/cover-art/generate-sections', {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN },
                      body: JSON.stringify({ sections: sections, style: albumGenre || '', trackTitle: t.title || '' })
                    });
                    if (imgResp.ok) {
                      var imgData = await imgResp.json();
                      var imageUrls = (imgData.images || []).filter(function(img) { return img.url; }).map(function(img) { return img.url; });
                      if (imageUrls.length > 0) {
                        t._stage = 'Rendering video (' + imageUrls.length + ' images)...';
                        render();
                        console.log('[AlbumBatch] Track ' + (i+1) + ': Generating video with ' + imageUrls.length + ' images');

                        /* Generate video */
                        var videoResp = await fetch('/api/inspire/video/generate-album', {
                          method: 'POST',
                          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN },
                          body: JSON.stringify({ audioUrl: t._audioUrl, images: imageUrls })
                        });
                        if (videoResp.ok) {
                          var videoData = await videoResp.json();
                          t._videoUrl = videoData.videoPath || '';
                          t._stage = 'Complete (+ video)';
                          console.log('[AlbumBatch] Track ' + (i+1) + ' video: ' + t._videoUrl);
                        } else {
                          var vErr = await videoResp.json().catch(function() { return {}; });
                          console.warn('[AlbumBatch] Track ' + (i+1) + ' video failed: ' + (vErr.error || videoResp.status));
                          t._stage = 'Audio complete (video failed)';
                        }
                      } else {
                        t._stage = 'Audio complete (no images)';
                      }
                    } else {
                      var iErr = await imgResp.json().catch(function() { return {}; });
                      console.warn('[AlbumBatch] Track ' + (i+1) + ' image gen failed: ' + (iErr.error || imgResp.status));
                      t._stage = 'Audio complete (images failed)';
                    }
                  } else {
                    t._stage = 'Audio complete';
                  }
                } else {
                  t._stage = 'Audio complete';
                }
              } catch(vidErr) {
                console.warn('[AlbumBatch] Track ' + (i+1) + ' video pipeline error:', vidErr);
                t._stage = 'Audio complete (video error)';
              }
              render();

              /* Brief pause between tracks */
              await sleep(1000);

            } catch(e) {
              t._status = 'error';
              t._stage = 'Failed: ' + e.message;
              render();
              console.error('[AlbumBatch] Track ' + (i+1) + ' failed:', e);
            }
          }

          generating = false;
          render();
          var finalDone = tracks.filter(function(t) { return t._status === 'done'; }).length;
          console.log('[AlbumBatch] Batch complete: ' + finalDone + '/' + tracks.length + ' succeeded');
        }

        /* Download all completed tracks as a ZIP file with folder structure:
           Artist Name/Album Title/01 - Track Title.wav
           Artist Name/Album Title/01 - Track Title.mp4 (if video generated) */
        async function downloadAlbumZip() {
          if (!window.JSZip) { alert('ZIP library is still loading. Please wait a moment and try again.'); return; }
          var doneTracks = tracks.filter(function(t) { return t._status === 'done' && t._audioUrl; });
          if (doneTracks.length === 0) { alert('No completed tracks to download.'); return; }

          var hasVideos = doneTracks.some(function(t) { return t._videoUrl; });
          var zipBtn = document.getElementById('ab-download-zip');
          if (zipBtn) { zipBtn.disabled = true; zipBtn.textContent = '\u23F3 Preparing ZIP...'; }

          try {
            var zip = new JSZip();
            var folder = zip.folder(albumArtist).folder(albumTitle);

            /* Add metadata.txt */
            var metaLines = ['Album: ' + albumTitle, 'Artist: ' + albumArtist, 'Tracks: ' + doneTracks.length, ''];
            for (var m = 0; m < doneTracks.length; m++) {
              var mt = doneTracks[m];
              metaLines.push(String(m+1).padStart(2,'0') + '. ' + (mt.title || 'Untitled') + (mt._videoUrl ? ' [video]' : ''));
            }
            folder.file('metadata.txt', metaLines.join('\n'));

            /* Fetch and add each audio + video file */
            for (var j = 0; j < doneTracks.length; j++) {
              var t = doneTracks[j];
              var trackNum = String(j+1).padStart(2,'0');
              var trackName = trackNum + ' - ' + (t.title || 'Untitled');

              /* Fetch audio */
              if (zipBtn) zipBtn.textContent = '\u23F3 Fetching audio ' + (j+1) + '/' + doneTracks.length + '...';
              try {
                var audioResp = await fetch(t._audioUrl);
                var audioBlob = await audioResp.blob();
                folder.file(trackName + '.wav', audioBlob);
              } catch(fetchErr) {
                console.error('[AlbumBatch] Failed to fetch audio ' + (j+1) + ':', fetchErr);
                folder.file(trackName + ' (AUDIO FAILED).txt', 'Failed to download: ' + fetchErr.message);
              }

              /* Fetch video if available */
              if (t._videoUrl) {
                if (zipBtn) zipBtn.textContent = '\u23F3 Fetching video ' + (j+1) + '/' + doneTracks.length + '...';
                try {
                  var vidResp = await fetch(t._videoUrl);
                  var vidBlob = await vidResp.blob();
                  folder.file(trackName + '.mp4', vidBlob);
                } catch(vidErr) {
                  console.error('[AlbumBatch] Failed to fetch video ' + (j+1) + ':', vidErr);
                  folder.file(trackName + ' (VIDEO FAILED).txt', 'Failed to download: ' + vidErr.message);
                }
              }
            }

            /* Generate the zip and trigger download */
            if (zipBtn) zipBtn.textContent = '\u23F3 Creating ZIP file...';
            var zipBlob = await zip.generateAsync({type: 'blob'}, function(meta) {
              if (zipBtn) zipBtn.textContent = '\u23F3 ZIP: ' + meta.percent.toFixed(0) + '%';
            });

            var zipName = albumArtist + ' - ' + albumTitle + '.zip';
            var link = document.createElement('a');
            link.href = URL.createObjectURL(zipBlob);
            link.download = zipName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);

            if (zipBtn) { zipBtn.disabled = false; zipBtn.textContent = '\u2713 ZIP Downloaded!'; }
            console.log('[AlbumBatch] ZIP downloaded: ' + zipName + ' (' + doneTracks.length + ' tracks' + (hasVideos ? ' + videos' : '') + ')');

          } catch(e) {
            console.error('[AlbumBatch] ZIP creation failed:', e);
            alert('ZIP download failed: ' + e.message);
            if (zipBtn) { zipBtn.disabled = false; zipBtn.textContent = '\uD83D\uDCE6 Download ZIP'; }
          }
        }

        /* Initialize: try to load template, then render */
        tryLoadTemplate();
      })();
    </script>
    <!-- ═══════════════════════════════════════════════════════════════════
         Album Library — Right-click context menus for album/track downloads
         ═══════════════════════════════════════════════════════════════════ -->
    <script>
      (function() {
        /* ─── Context Menu System ─── */
        var activeMenu = null;
        function closeMenu() { if (activeMenu) { activeMenu.remove(); activeMenu = null; } }
        document.addEventListener('click', closeMenu);
        document.addEventListener('contextmenu', function() { setTimeout(closeMenu, 50); });

        function showMenu(x, y, items) {
          closeMenu();
          var menu = document.createElement('div');
          menu.style.cssText = 'position:fixed;z-index:99999;background:rgba(24,24,27,0.97);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:6px 0;box-shadow:0 8px 32px rgba(0,0,0,0.6);min-width:200px;font-family:system-ui,-apple-system,sans-serif;font-size:13px;';
          items.forEach(function(item) {
            if (item === '---') {
              var hr = document.createElement('div');
              hr.style.cssText = 'height:1px;background:rgba(255,255,255,0.1);margin:4px 8px;';
              menu.appendChild(hr);
              return;
            }
            var btn = document.createElement('div');
            btn.style.cssText = 'padding:8px 16px;cursor:pointer;display:flex;align-items:center;gap:8px;color:#e4e4e7;transition:background 0.15s;';
            btn.onmouseenter = function() { this.style.background = 'rgba(168,85,247,0.3)'; };
            btn.onmouseleave = function() { this.style.background = 'transparent'; };
            if (item.disabled) { btn.style.opacity = '0.4'; btn.style.pointerEvents = 'none'; }
            var icon = document.createElement('span');
            icon.textContent = item.icon || '';
            icon.style.cssText = 'font-size:14px;width:20px;text-align:center;';
            var label = document.createElement('span');
            label.textContent = item.label;
            if (item.bold) label.style.fontWeight = '600';
            if (item.color) btn.style.color = item.color;
            btn.appendChild(icon);
            btn.appendChild(label);
            if (item.sub) {
              var sub = document.createElement('span');
              sub.textContent = item.sub;
              sub.style.cssText = 'margin-left:auto;font-size:11px;opacity:0.5;';
              btn.appendChild(sub);
            }
            btn.addEventListener('click', function(e) { e.stopPropagation(); closeMenu(); if (item.action) item.action(); });
            menu.appendChild(btn);
          });
          /* Position: flip if near edges */
          document.body.appendChild(menu);
          var mw = menu.offsetWidth, mh = menu.offsetHeight;
          if (x + mw > window.innerWidth - 8) x = window.innerWidth - mw - 8;
          if (y + mh > window.innerHeight - 8) y = window.innerHeight - mh - 8;
          if (x < 8) x = 8; if (y < 8) y = 8;
          menu.style.left = x + 'px';
          menu.style.top = y + 'px';
          activeMenu = menu;
        }

        /* ─── Download Helper ─── */
        function downloadSong(songId, format, bitrate) {
          bitrate = bitrate || 192;
          var a = document.createElement('a');
          a.href = '/api/download/' + encodeURIComponent(songId) + '?format=' + format + '&bitrate=' + bitrate;
          a.download = '';
          a.style.display = 'none';
          document.body.appendChild(a);
          a.click();
          setTimeout(function() { a.remove(); }, 1000);
        }
        function downloadAlbumZip(albumName, format) {
          var a = document.createElement('a');
          a.href = '/api/download/album-zip?album=' + encodeURIComponent(albumName) + '&format=' + (format || 'wav');
          a.download = '';
          a.style.display = 'none';
          document.body.appendChild(a);
          a.click();
          setTimeout(function() { a.remove(); }, 1000);
        }

        /* ─── Expose to global scope for batch handler ─── */
        window.__albumLib = {
          showSongMenu: function(e, song) {
            e.preventDefault(); e.stopPropagation();
            showMenu(e.clientX, e.clientY, [
              { icon: '🎵', label: 'Download WAV', bold: true, action: function() { downloadSong(song.id, 'wav'); } },
              { icon: '📀', label: 'Download MP3', action: function() { downloadSong(song.id, 'mp3'); } },
              { icon: '🎧', label: 'Download Opus', action: function() { downloadSong(song.id, 'opus'); } },
              { icon: '💿', label: 'Download FLAC', action: function() { downloadSong(song.id, 'flac'); } },
            ]);
          },
          showAlbumMenu: function(e, album) {
            e.preventDefault(); e.stopPropagation();
            var fmt = (localStorage.getItem('ace-settings') || '{}');
            try { fmt = JSON.parse(fmt); } catch(ex) { fmt = {}; }
            var pref = fmt.downloadFormat || 'wav';
            showMenu(e.clientX, e.clientY, [
              { icon: '📦', label: 'ZIP: All Tracks (' + pref.toUpperCase() + ')', bold: true, color: '#a78bfa', action: function() { downloadAlbumZip(album.name, pref); } },
              { icon: '---' },
              { icon: '🎵', label: 'ZIP: All Tracks as WAV', sub: album.songs.length + ' tracks', action: function() { downloadAlbumZip(album.name, 'wav'); } },
              { icon: '📀', label: 'ZIP: All Tracks as MP3', sub: album.songs.length + ' tracks', action: function() { downloadAlbumZip(album.name, 'mp3'); } },
              { icon: '🎧', label: 'ZIP: All Tracks as Opus', sub: album.songs.length + ' tracks', action: function() { downloadAlbumZip(album.name, 'opus'); } },
              { icon: '💿', label: 'ZIP: All Tracks as FLAC', sub: album.songs.length + ' tracks', action: function() { downloadAlbumZip(album.name, 'flac'); } },
              { icon: '---' },
              { icon: '📋', label: 'Track List', disabled: false, action: function() {
                var list = album.songs.map(function(s, i) { return (i+1) + '. ' + (s.title || 'Untitled'); }).join('\n');
                navigator.clipboard.writeText(album.name + ' — ' + (album.artist || 'Unknown Artist') + '\n' + list).then(function() {
                  alert('Track list copied to clipboard!');
                });
              }},
            ]);
          },
          downloadAlbumZip: downloadAlbumZip,
          downloadSong: downloadSong
        };
        console.log('[AlbumLib] Context menus ready');
      })();
    </script>
