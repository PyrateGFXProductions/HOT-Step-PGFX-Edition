    <!-- Visualizer Inline Overlay — click toggles beat-reactive visualization on/off.
         Right-click cycles modes (Bars/Wave/Circular/Tunnel/Starfield/Liquid).
         visualizer.html evolves into the Music Video Creator page. -->
    <script>
      (function() {
        /* =====================================================================
           Monkey-patch AudioContext.prototype.createMediaElementSource
           Runs BEFORE React module loads (inline scripts execute before deferred modules).
           Intercepts ALL createMediaElementSource calls and captures the source node
           + its owning AudioContext. This is the ONLY way to tap into WaveSurfer's
           audio graph — its audio element lives in JS memory, NOT in the DOM. */
        var _origCreateMES = AudioContext.prototype.createMediaElementSource;
        window._vizCapturedSource = null;
        window._vizCapturedCtx = null;
        AudioContext.prototype.createMediaElementSource = function(element) {
          var source = _origCreateMES.call(this, element);
          window._vizCapturedSource = source;
          window._vizCapturedCtx = this;
          console.log('[Viz] Intercepted createMediaElementSource — source captured');
          return source;
        };

        var vizActive = false;
        var vizCanvas = null;
        var vizCtx = null;
        var vizControls = null;
        var vizModeLabel = null;
        var vizMode = parseInt(localStorage.getItem('hs-viz-mode') || '0', 10);
        var vizBtn = null;
        var vizRaf = null;
        var analyser = null;
        var freqData = null;
        var timeData = null;
        var globalTime = 0;
        var isBeat = false, beatEnergy = 0, kickE = 0, snareE = 0, hihatE = 0;
        var runningEnergy = 0.01, lastBeatTime = 0, avgEnergy = 0.1;
        var sensitivity = 1.3;
        var FFT = 2048;
        var MIN_BEAT_MS = 150;

        var MODES = ['Bars','Wave','Circular','Tunnel','Starfield','Liquid'];
        if(isNaN(vizMode)||vizMode<0||vizMode>=MODES.length)vizMode=0;
        var COLOR_SCHEMES = [
          ['#00ffff','#ff00ff','#00ff66','#ff8800','#ffff00','#ff4488'],
          ['#ff2200','#ff6600','#ffaa00','#ff4400','#cc0000','#ff8844'],
          ['#0044ff','#0088ff','#00ccff','#00ffcc','#4488ff','#0066cc'],
        ];
        var colorScheme = 0;

        function hexToRgb(hex){return[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];}
        function schemeColor(t,alpha){
          var sc=COLOR_SCHEMES[colorScheme],idx=t*(sc.length-1),i0=Math.floor(idx),i1=Math.min(i0+1,sc.length-1),frac=idx-i0;
          var c0=hexToRgb(sc[i0]),c1=hexToRgb(sc[i1]);
          var r=Math.round(c0[0]+(c1[0]-c0[0])*frac),g=Math.round(c0[1]+(c1[1]-c0[1])*frac),b=Math.round(c0[2]+(c1[2]-c0[2])*frac);
          return alpha!==undefined?'rgba('+r+','+g+','+b+','+alpha+')':'rgb('+r+','+g+','+b+')';
        }
        function hzBin(hz){return Math.round(hz*FFT/(window._vizCapturedCtx?window._vizCapturedCtx.sampleRate:44100));}
        function barHeight(i,total){
          if(!freqData)return 0;
          var logMin=Math.log(1),logMax=Math.log(freqData.length);
          var idx=Math.exp(logMin+(logMax-logMin)*(i/total));
          var i0=Math.floor(idx),i1=Math.min(i0+1,freqData.length-1),frac=idx-i0;
          return(freqData[i0]*(1-frac)+freqData[i1]*frac)/255;
        }

        function detectBeat(now){
          if(!freqData||!analyser)return;
          try{
          analyser.getByteFrequencyData(freqData);
          analyser.getByteTimeDomainData(timeData);
          }catch(e){return;}
          var kL=hzBin(50),kH=hzBin(200),sL=hzBin(200),sH=hzBin(2000),hL=hzBin(4000),hH=hzBin(16000);
          var kE=0,sE=0,hE=0,kC=0,sC=0,hC=0;
          for(var i=kL;i<=kH&&i<freqData.length;i++){kE+=freqData[i];kC++;}
          for(var i=sL;i<=sH&&i<freqData.length;i++){sE+=freqData[i];sC++;}
          for(var i=hL;i<=hH&&i<freqData.length;i++){hE+=freqData[i];hC++;}
          kickE=kC?kE/kC/255:0;snareE=sC?sE/sC/255:0;hihatE=hC?hE/hC/255:0;
          var total=kickE*0.6+snareE*0.3+hihatE*0.1;
          avgEnergy=avgEnergy*0.995+total*0.005;
          runningEnergy+=(total-runningEnergy)*0.05;
          isBeat=false;beatEnergy=0;
          if(total>runningEnergy*sensitivity&&(now-lastBeatTime)>MIN_BEAT_MS){
            isBeat=true;beatEnergy=Math.min(1,(total-runningEnergy*sensitivity)/(runningEnergy+0.01));lastBeatTime=now;
          }
        }

        /* --- Renderers (transparent backgrounds — canvas element CSS provides the backdrop) --- */
        var BAR_COUNT=64,peakH=new Float32Array(BAR_COUNT),peakF=new Float32Array(BAR_COUNT);
        function renderBars(ctx,W,H){
          ctx.clearRect(0,0,W,H);
          var gap=3,barW=(W-gap*(BAR_COUNT+1))/BAR_COUNT,baseline=H*0.82,maxH=H*0.68;
          var hasAudio=freqData&&analyser;
          for(var i=0;i<BAR_COUNT;i++){
            var h;
            if(hasAudio){h=barHeight(i,BAR_COUNT)*maxH;}
            else{/* Idle animation: gentle sine wave when no audio */
              h=(Math.sin(globalTime*2+i*0.15)*0.5+0.5)*maxH*0.15+2;}
            var x=gap+i*(barW+gap),t=i/BAR_COUNT;
            ctx.fillStyle=schemeColor(t,0.8);
            if(h>1)ctx.fillRect(x,baseline-h,barW,h);
            if(h>peakH[i]){peakH[i]=h;peakF[i]=0;}else{peakF[i]+=0.06;peakH[i]-=peakF[i];if(peakH[i]<0)peakH[i]=0;}
            if(peakH[i]>2){ctx.fillStyle=schemeColor(t,0.9);ctx.fillRect(x,baseline-peakH[i]-3,barW,3);}
          }
          if(!hasAudio){
            ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='14px system-ui,sans-serif';ctx.textAlign='center';
            ctx.fillText('Waiting for audio...',W/2,H/2);
          }
        }
        function renderWave(ctx,W,H){
          ctx.clearRect(0,0,W,H);
          ctx.beginPath();ctx.strokeStyle=schemeColor(0.5,0.8);ctx.lineWidth=2;
          var hasAudio=timeData&&analyser;
          var sliceW=W/(hasAudio?timeData.length:256);
          if(hasAudio){
            ctx.moveTo(0,H/2+((timeData[0]-128)/128)*H*0.35);
            for(var i=1;i<timeData.length;i++){var v=(timeData[i]-128)/128;ctx.lineTo(i*sliceW,H/2+v*H*0.35);}
          }else{
            ctx.moveTo(0,H/2);
            for(var i=0;i<256;i++){var v=Math.sin(globalTime*3+i*0.05)*0.1;ctx.lineTo(i*sliceW,H/2+v*H*0.35);}
          }
          ctx.stroke();
          if(!hasAudio){ctx.fillStyle='rgba(255,255,255,0.3)';ctx.font='14px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('Waiting for audio...',W/2,H*0.3);}
        }
        function renderCircular(ctx,W,H){
          ctx.clearRect(0,0,W,H);if(!freqData)return;
          var cx=W/2,cy=H/2,baseR=Math.min(W,H)*0.2,bars=128,maxL=Math.min(W,H)*0.3;
          ctx.save();ctx.translate(cx,cy);ctx.rotate(globalTime*0.15*Math.PI/180);
          var bW=Math.max(1.5,(Math.PI*2*baseR/bars)*0.55);
          for(var i=0;i<bars;i++){
            var ang=(i/bars)*Math.PI*2-Math.PI/2;
            var h=barHeight(i,bars)*maxL*(isBeat?1+beatEnergy*0.6:1);
            ctx.strokeStyle=schemeColor(i/bars,0.8);ctx.lineWidth=bW;ctx.lineCap='round';
            ctx.beginPath();
            ctx.moveTo(Math.cos(ang)*baseR,Math.sin(ang)*baseR);
            ctx.lineTo(Math.cos(ang)*(baseR+h),Math.sin(ang)*(baseR+h));
            ctx.stroke();
          }
          ctx.restore();
        }
        function renderTunnel(ctx,W,H){
          ctx.clearRect(0,0,W,H);
          var cx=W/2,cy=H/2,speed=globalTime*2;
          for(var i=40;i>=1;i--){
            var t=i/40,z=(t+speed)%1,sz=Math.pow(1-z,2)*Math.max(W,H)*0.9;
            if(sz<2)continue;var alpha=(1-z)*0.5,hue=(i*8+globalTime*40)%360;
            ctx.strokeStyle='hsla('+hue+',80%,'+(40+z*20)+'%,'+alpha+')';ctx.lineWidth=1+z*2;
            ctx.beginPath();var r=sz/2,rr=r*0.15;
            ctx.moveTo(cx-r+rr,cy-r);ctx.lineTo(cx+r-rr,cy-r);ctx.arcTo(cx+r,cy-r,cx+r,cy-r+rr,rr);
            ctx.lineTo(cx+r,cy+r-rr);ctx.arcTo(cx+r,cy+r,cx+r-rr,cy+r,rr);
            ctx.lineTo(cx-r+rr,cy+r);ctx.arcTo(cx-r,cy+r,cx-r,cy+r-rr,rr);
            ctx.lineTo(cx-r,cy-r+rr);ctx.arcTo(cx-r,cy-r,cx-r+rr,cy-r,rr);
            ctx.closePath();ctx.stroke();
          }
        }
        var stars=[];
        for(var si=0;si<200;si++)stars.push({x:(Math.random()-0.5)*4,y:(Math.random()-0.5)*4,z:Math.random()*4,sz:0.5+Math.random()*1.5});
        function renderStarfield(ctx,W,H){
          ctx.clearRect(0,0,W,H);
          var speed=isBeat?0.03:0.01,cx=W/2,cy=H/2;
          for(var i=0;i<stars.length;i++){
            var s=stars[i];s.z-=speed;
            if(s.z<=0){s.x=(Math.random()-0.5)*4;s.y=(Math.random()-0.5)*4;s.z=4;}
            var px=cx+s.x/s.z*W*0.5,py=cy+s.y/s.z*H*0.5;
            if(px<0||px>W||py<0||py>H)continue;
            ctx.globalAlpha=(1-s.z/4);ctx.fillStyle=schemeColor(i/stars.length,1);
            ctx.beginPath();ctx.arc(px,py,s.sz*(1-s.z/4)*3,0,Math.PI*2);ctx.fill();
          }
          ctx.globalAlpha=1;
        }
        var liquidT=0;
        function renderLiquid(ctx,W,H){
          ctx.clearRect(0,0,W,H);
          liquidT+=isBeat?0.04:0.01;
          for(var l=0;l<5;l++){var t=l/5;ctx.beginPath();
            for(var x=0;x<=W;x+=4){var nx=x/W,y=H*0.3+H*0.35*t;
              y+=Math.sin(nx*4+liquidT*(1+t*2))*30*(1+kickE*2);
              y+=Math.sin(nx*7-liquidT*0.8+t*3)*15*(1+snareE);
              y+=Math.sin(nx*2.5+liquidT*0.5)*20*hihatE;
              if(x===0)ctx.moveTo(0,y);else ctx.lineTo(x,y);
            }
            ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();
            ctx.fillStyle=schemeColor(t,0.25+l*0.05);ctx.fill();
          }
        }
        var renderers=[renderBars,renderWave,renderCircular,renderTunnel,renderStarfield,renderLiquid];

        /* --- Audio graph (connect/disconnect per activation for latency) --- */
        function ensureAudioGraph(){
          if(analyser)return;
          var src=window._vizCapturedSource;
          var ctx2=window._vizCapturedCtx;
          if(!src||!ctx2)return;
          try{
            analyser=ctx2.createAnalyser();
            analyser.fftSize=FFT;
            analyser.smoothingTimeConstant=0.8;
            freqData=new Uint8Array(analyser.frequencyBinCount);
            timeData=new Uint8Array(analyser.frequencyBinCount);
            src.connect(analyser);
            console.log('[Viz] Connected to shared AudioContext (sampleRate:',ctx2.sampleRate,')');
          }catch(e){console.warn('[Viz] Analyser connection failed:',e.message);analyser=null;}
        }
        function disconnectAudio(){
          if(analyser){try{analyser.disconnect();}catch(ex){} analyser=null;freqData=null;timeData=null;}
        }

        /* --- Canvas (transparent — CSS backdrop provides the dark overlay) --- */
        function ensureCanvas(){
          if(vizCanvas)return;
          vizCanvas=document.createElement('canvas');
          vizCanvas.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:9998;pointer-events:none;opacity:0;transition:opacity 0.4s;background:rgba(0,0,0,0.78);';
          document.body.appendChild(vizCanvas);
          vizCtx=vizCanvas.getContext('2d');
          vizCanvas.width=window.innerWidth;vizCanvas.height=window.innerHeight;
          window.addEventListener('resize',function(){if(vizCanvas){vizCanvas.width=window.innerWidth;vizCanvas.height=window.innerHeight;}});
        }

        /* --- Control bar (HTML overlay on top of canvas) --- */
        function ensureControls(){
          if(vizControls)return;
          vizControls=document.createElement('div');
          vizControls.style.cssText='position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:10000;display:none;align-items:center;gap:8px;padding:6px 14px;border-radius:12px;background:rgba(24,24,27,0.9);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);box-shadow:0 4px 20px rgba(0,0,0,0.5);font-family:system-ui,sans-serif;color:#e4e4e7;font-size:13px;user-select:none;';
          /* Prev mode */
          var prevBtn=document.createElement('button');
          prevBtn.textContent='\u25C0';
          prevBtn.title='Previous mode';
          prevBtn.style.cssText='background:none;border:none;color:#a1a1aa;font-size:14px;cursor:pointer;padding:4px 8px;border-radius:6px;transition:all 0.15s;';
          prevBtn.onmouseenter=function(){this.style.background='rgba(255,255,255,0.1)';};
          prevBtn.onmouseleave=function(){this.style.background='none';};
          prevBtn.onclick=function(e){e.stopPropagation();cycleMode(-1);};
          vizControls.appendChild(prevBtn);
          /* Mode label */
          vizModeLabel=document.createElement('span');
          vizModeLabel.style.cssText='min-width:70px;text-align:center;font-weight:600;color:#a78bfa;';
          vizModeLabel.textContent=MODES[vizMode];
          vizControls.appendChild(vizModeLabel);
          /* Next mode */
          var nextBtn=document.createElement('button');
          nextBtn.textContent='\u25B6';
          nextBtn.title='Next mode';
          nextBtn.style.cssText='background:none;border:none;color:#a1a1aa;font-size:14px;cursor:pointer;padding:4px 8px;border-radius:6px;transition:all 0.15s;';
          nextBtn.onmouseenter=function(){this.style.background='rgba(255,255,255,0.1)';};
          nextBtn.onmouseleave=function(){this.style.background='none';};
          nextBtn.onclick=function(e){e.stopPropagation();cycleMode(1);};
          vizControls.appendChild(nextBtn);
          /* Separator */
          var sep=document.createElement('span');
          sep.textContent='\u2022';
          sep.style.cssText='color:#52525b;padding:0 4px;';
          vizControls.appendChild(sep);
          /* Close button */
          var closeBtn=document.createElement('button');
          closeBtn.textContent='\u2715';
          closeBtn.title='Close visualizer (Esc)';
          closeBtn.style.cssText='background:none;border:none;color:#ef4444;font-size:16px;cursor:pointer;padding:4px 8px;border-radius:6px;transition:all 0.15s;font-weight:bold;';
          closeBtn.onmouseenter=function(){this.style.background='rgba(239,68,68,0.2)';};
          closeBtn.onmouseleave=function(){this.style.background='none';};
          closeBtn.onclick=function(e){e.stopPropagation();deactivate();};
          vizControls.appendChild(closeBtn);
          document.body.appendChild(vizControls);
        }

        function cycleMode(dir){
          vizMode=(vizMode+dir+MODES.length)%MODES.length;
          localStorage.setItem('hs-viz-mode',String(vizMode));
          peakH.fill(0);peakF.fill(0);liquidT=0;
          if(vizModeLabel)vizModeLabel.textContent=MODES[vizMode];
          if(vizBtn)vizBtn.title='Visualizer ON — '+MODES[vizMode];
        }

        function vizLoop(){
          if(!vizActive)return;
          var W=vizCanvas.width,H=vizCanvas.height;
          globalTime+=0.016;
          detectBeat(performance.now());
          var renderer=renderers[vizMode];
          if(renderer)renderer(vizCtx,W,H);
          vizRaf=requestAnimationFrame(vizLoop);
        }

        function activate(){
          vizActive=true;ensureCanvas();ensureControls();ensureAudioGraph();
          vizCanvas.style.opacity='1';
          vizControls.style.display='flex';
          vizBtn.style.color='#22d3ee';vizBtn.style.textShadow='0 0 8px rgba(34,211,238,0.5)';
          vizBtn.title='Visualizer ON — '+MODES[vizMode];
          vizLoop();
          /* Retry audio connection every second — SpectrumAnalyzer may not have initialized yet */
          var retryCount=0;
          var retryInterval=setInterval(function(){
            if(!vizActive||retryCount++>30){clearInterval(retryInterval);return;}
            if(!analyser){
              ensureAudioGraph();
              if(analyser){console.log('[Viz] Audio connected after retry #'+retryCount);clearInterval(retryInterval);}
            }else{clearInterval(retryInterval);}
          },1000);
        }
        function deactivate(){
          vizActive=false;
          if(vizCanvas)vizCanvas.style.opacity='0';
          if(vizControls)vizControls.style.display='none';
          if(vizRaf){cancelAnimationFrame(vizRaf);vizRaf=null;}
          disconnectAudio();
          vizBtn.style.color='#71717a';vizBtn.style.textShadow='none';
          vizBtn.title='Visualizer — click to activate';
        }

        /* Esc key to exit */
        document.addEventListener('keydown',function(e){if(e.key==='Escape'&&vizActive)deactivate();});

        var injected=false;
        function injectButton(){
          if(injected)return;
          var allBtns=document.querySelectorAll('button'),discoBtn=null;
          for(var i=0;i<allBtns.length;i++){var t=allBtns[i].title||'';if(t.indexOf('Disco')>=0||t.indexOf('disco')>=0){discoBtn=allBtns[i];break;}}
          if(!discoBtn||!discoBtn.parentNode)return;
          vizBtn=document.createElement('button');
          vizBtn.title='Visualizer — click to activate';
          vizBtn.style.cssText='padding:6px;border-radius:8px;color:#71717a;background:transparent;border:none;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;flex-shrink:0;';
          vizBtn.onmouseenter=function(){if(!vizActive)vizBtn.style.color='#22d3ee';};
          vizBtn.onmouseleave=function(){if(!vizActive)vizBtn.style.color='#71717a';};
          vizBtn.onclick=function(){if(vizActive)deactivate();else activate();};
          vizBtn.oncontextmenu=function(e){e.preventDefault();vizMode=(vizMode+1)%MODES.length;localStorage.setItem('hs-viz-mode',String(vizMode));peakH.fill(0);peakF.fill(0);liquidT=0;if(vizBtn)vizBtn.title='Visualizer ON — Mode: '+MODES[vizMode]+' (click=toggle, right-click=cycle)';if(vizModeLabel)vizModeLabel.textContent=MODES[vizMode];};
          vizBtn.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="15" height="13" rx="2" ry="2"></rect><polygon points="17 2 22 7 17 12 17 2"></polygon><path d="M7 11v2a2 2 0 0 0 2 2h5"></path></svg>';
          discoBtn.parentNode.insertBefore(vizBtn,discoBtn.nextSibling);
          injected=true;
        }
        setInterval(function(){if(!injected)injectButton();},1000);
        if(typeof MutationObserver!=='undefined'){new MutationObserver(function(){setTimeout(function(){if(!injected)injectButton();},300);}).observe(document.body,{childList:true,subtree:true});}
      })();
    </script>
    <!-- Music Video Creator Button -->
    <script>
      (function() {
        var injected=false;
        function injectMVCButton(){
          if(injected)return;
          /* Find the visualizer button we just injected */
          var allBtns=document.querySelectorAll('button'),vizBtnRef=null;
          for(var i=0;i<allBtns.length;i++){var t=allBtns[i].title||'';if(t.indexOf('Visualizer')>=0){vizBtnRef=allBtns[i];break;}}
          if(!vizBtnRef||!vizBtnRef.parentNode)return;
          var mvcBtn=document.createElement('button');
          mvcBtn.title='Music Video Creator — stem-reactive layers + AI video generation';
          mvcBtn.style.cssText='padding:6px;border-radius:8px;color:#71717a;background:transparent;border:none;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;flex-shrink:0;';
          mvcBtn.onmouseenter=function(){mvcBtn.style.color='#a78bfa';};
          mvcBtn.onmouseleave=function(){mvcBtn.style.color='#71717a';};
          mvcBtn.onclick=function(){
            /* Get current song ID — try multiple sources */
            var songId=window.__currentSongId||null;
            if(!songId){
              /* Try URL param */
              var m=window.location.search.match(/id=([^&]+)/);
              if(m) songId=m[1];

          '</div>' +

          /* Local mode help */
          '<div id="ca-local-help" style="margin-top:8px;padding:8px;background:#0f172a;border-radius:6px;font-size:11px;color:#64748b;">' +
          'Local mode uses <code>sd-cli.exe</code> with models in the <code>models/cover-art/</code> directory. ' +
          'Download missing models via <b>Settings \u2192 Cover Art \u2192 Download Models + Engine</b>.</div>';

        document.body.appendChild(panel);

        /* Toggle panel on button click */
        btn.onclick = function() {
          panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
          if (panel.style.display === 'block') refreshComfyUIStatus();
        };

        /* Close button */
        document.getElementById('ca-panel-close').onclick = function() { panel.style.display = 'none'; };

        /* Load saved settings */
        function loadSavedSettings() {
          try {
            var useComfyUI = localStorage.getItem('hs-coverArtUseComfyUI');
            document.getElementById('ca-use-comfyui').checked = useComfyUI === 'true';
            var savedModel = localStorage.getItem('hs-coverArtModel') || '';
            var savedVae = localStorage.getItem('hs-coverArtVae') || '';
            var savedClip = localStorage.getItem('hs-coverArtClip') || '';
            if (savedModel) document.getElementById('ca-unet-model').value = savedModel;
            if (savedVae) document.getElementById('ca-vae-model').value = savedVae;
            if (savedClip) document.getElementById('ca-clip-model').value = savedClip;
          } catch(e) { console.warn('[CoverArtPanel] Error loading settings:', e); }
        }

        /* Save settings to localStorage */
        function saveSettings() {
          try {
            var useComfyUI = document.getElementById('ca-use-comfyui').checked;
            localStorage.setItem('hs-coverArtUseComfyUI', useComfyUI ? 'true' : 'false');
            localStorage.setItem('hs-coverArtModel', document.getElementById('ca-unet-model').value || '');
            localStorage.setItem('hs-coverArtVae', document.getElementById('ca-vae-model').value || '');
            localStorage.setItem('hs-coverArtClip', document.getElementById('ca-clip-model').value || '');
          } catch(e) { console.warn('[CoverArtPanel] Error saving settings:', e); }
        }

        /* Refresh ComfyUI status + model list */
        async function refreshComfyUIStatus() {
          var dot = document.getElementById('ca-status-dot');
          var text = document.getElementById('ca-status-text');
          var selectors = document.getElementById('ca-model-selectors');
          var localHelp = document.getElementById('ca-local-help');

          dot.style.background = '#f59e0b';
          text.textContent = 'Connecting...';

          try {
            var resp = await fetch('/api/cover-art/comfyui-models', { signal: AbortSignal.timeout(8000) });
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            var data = await resp.json();

            if (data.connected) {
              dot.style.background = '#10b981';
              text.textContent = 'ComfyUI connected \u2014 ' + data.systemInfo.deviceName + ' (' +
                (data.systemInfo.vramFree / 1e9).toFixed(1) + 'GB free)';
              populateSelector('ca-unet-model', data.models.unet);
              populateSelector('ca-vae-model', data.models.vae);
              populateSelector('ca-clip-model', data.models.clip);
              selectors.style.display = 'block';
              localHelp.style.display = 'none';
            } else {
              dot.style.background = '#ef4444';
              text.textContent = 'ComfyUI not reachable. Switch to Local mode or start ComfyUI.';
              selectors.style.display = 'none';
              localHelp.style.display = 'block';
            }
          } catch (err) {
            dot.style.background = '#ef4444';
            text.textContent = 'Connection failed: ' + err.message;
            selectors.style.display = 'none';
            localHelp.style.display = 'block';
          }
        }

        /* Populate a dropdown with model options */
        function populateSelector(selectId, models) {
          var sel = document.getElementById(selectId);
          var current = sel.value;
          sel.innerHTML = '<option value="">\u2014 Auto-detect \u2014</option>' +
            '<option value="" disabled style="font-size:1px;">\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014</option>';
          if (!models || models.length === 0) {
            sel.innerHTML += '<option value="" disabled style="color:#64748b;">(no models found)</option>';
            return;
          }
          for (var i = 0; i < models.length; i++) {
            var opt = document.createElement('option');
            opt.value = models[i].name;
            opt.textContent = models[i].name + (models[i].sizeFormatted ? ' (' + models[i].sizeFormatted + ')' : '');
            if (models[i].name === current) opt.selected = true;
            sel.appendChild(opt);
          }
        }

        /* Wire up refresh button */
        document.getElementById('ca-refresh-models').onclick = refreshComfyUIStatus;

        /* Wire up mode toggle and selector changes to auto-save */
        document.getElementById('ca-use-comfyui').onchange = function() {
          saveSettings();
          var modeLabel = document.getElementById('ca-mode-label');
          modeLabel.textContent = this.checked ? '(cover art uses your ComfyUI)' : '(cover art uses local sd-cli)';
          if (this.checked) refreshComfyUIStatus();
          else {
            document.getElementById('ca-model-selectors').style.display = 'none';
            document.getElementById('ca-local-help').style.display = 'block';
          }
        };
        document.getElementById('ca-unet-model').onchange = saveSettings;
        document.getElementById('ca-vae-model').onchange = saveSettings;
        document.getElementById('ca-clip-model').onchange = saveSettings;

        /* Initialize */
        loadSavedSettings();
        var initChecked = document.getElementById('ca-use-comfyui').checked;
        document.getElementById('ca-mode-label').textContent = initChecked ? '(cover art uses your ComfyUI)' : '(cover art uses local sd-cli)';
        /* Don't auto-connect on page load — only when panel is opened */
        console.log('[CoverArtPanel] ComfyUI model picker initialized');
      })();
    </script>
    <!-- Cover Art Post-Processing ComfyUI Bridge Status Indicator -->
    <script>
    (function() {
      /* Injects ComfyUI bridge status into the Post-Processing Panel's Cover Art section */
      var injected = false;
      function injectComfyUICoverArtStatus() {
        if (injected) return;
        /* Look for the Cover Art section's description text */
        var allElements = document.querySelectorAll('p, div, span');
        var coverArtDesc = null;
        for (var i = 0; i < allElements.length; i++) {
          if (allElements[i].textContent && allElements[i].textContent.indexOf('Generate 1024') >= 0 && allElements[i].textContent.indexOf('FLUX.2-klein-4B') >= 0) {
            coverArtDesc = allElements[i];
            break;
          }
        }
        if (!coverArtDesc) { return; }

        /* Check if we already injected here */
        var parent = coverArtDesc.parentNode;
        if (!parent || parent.querySelector('.ca-comfyui-pp-indicator')) return;
        injected = true;

        /* Fetch ComfyUI bridge status */
        var indicator = document.createElement('div');
        indicator.className = 'ca-comfyui-pp-indicator';
        indicator.style.cssText = 'margin-top:6px;padding:6px 8px;border-radius:6px;font-size:10px;line-height:1.4;display:flex;align-items:center;gap:6px;';

        fetch('/api/cover-art/comfyui-models', { signal: AbortSignal.timeout(5000) })
          .then(function(r) { return r.ok ? r.json() : Promise.reject('HTTP ' + r.status); })
          .then(function(data) {
            if (data && data.connected && data.models && data.models.length > 0) {
              var modelName = data.models[0].name || data.models[0].filename || '9B model';
              indicator.style.cssText += 'background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.15);color:#22c55e;';
              indicator.innerHTML = '<span style="width:6px;height:6px;border-radius:50%;background:#22c55e;display:inline-block;flex-shrink:0;"></span> ComfyUI Bridge: <strong>' + escapeHtml(modelName) + '</strong> <span style="opacity:0.6">(' + data.models.length + ' models available)</span>';
            } else if (data && data.connected) {
              indicator.style.cssText += 'background:rgba(250,204,21,0.08);border:1px solid rgba(250,204,21,0.15);color:#eab308;';
              indicator.innerHTML = '<span style="width:6px;height:6px;border-radius:50%;background:#eab308;display:inline-block;flex-shrink:0;"></span> ComfyUI Bridge: Connected (no diffusion models found)';
            } else {
              indicator.style.cssText += 'background:rgba(161,161,170,0.08);border:1px solid rgba(161,161,170,0.15);color:#a1a1aa;';
              indicator.innerHTML = '<span style="width:6px;height:6px;border-radius:50%;background:#a1a1aa;display:inline-block;flex-shrink:0;"></span> ComfyUI Bridge: Disconnected — using local 4B';
            }
          })
          .catch(function() {
            indicator.style.cssText += 'background:rgba(161,161,170,0.08);border:1px solid rgba(161,161,170,0.15);color:#a1a1aa;';
            indicator.innerHTML = '<span style="width:6px;height:6px;border-radius:50%;background:#a1a1aa;display:inline-block;flex-shrink:0;"></span> ComfyUI Bridge: Offline — using local 4B';
          })
          .finally(function() {
            if (indicator.parentNode) return;
            /* Insert after the description element */
            var container = coverArtDesc.parentNode;
            if (container) container.appendChild(indicator);
          });

        var container = coverArtDesc.parentNode;
        if (container && !indicator.parentNode) container.appendChild(indicator);
      }

      function escapeHtml(s) {
        if (!s) return '';
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }

      /* Observe for the Cover Art section to appear (Post-Processing panel opens on user action) */
      var observer = new MutationObserver(function() {
        setTimeout(injectComfyUICoverArtStatus, 100);
      });
      observer.observe(document.body, { childList: true, subtree: true });
      /* Also try periodically */
      setInterval(injectComfyUICoverArtStatus, 2000);
      /* Initial check */
      setTimeout(injectComfyUICoverArtStatus, 500);
    })();
    </script>
    <!-- Creativity Slider — Controls how strictly/loosely the LLM interprets genre prompts.
         Injects into /api/inspire/llm calls via fetch monkey-patch above. -->
    <script>
    (function() {
      var STORAGE_KEY = 'hs-instagen-creativity';
      var currentVal = parseFloat(localStorage.getItem(STORAGE_KEY)) || 0.5;
      currentVal = Math.max(0, Math.min(1, currentVal));

      function getLabel(val) {
        if (val < 0.15) return 'Precise';
        if (val < 0.35) return 'Balanced';
        if (val < 0.55) return 'Creative';
        if (val < 0.75) return 'Adventurous';
        return 'Wild';
      }

      function getDesc(val) {
        if (val < 0.15) return 'Follow instructions precisely — safe & consistent';
        if (val < 0.35) return 'Moderate creativity — default sweet spot';
        if (val < 0.55) return 'Allow interpretation — more surprises';
        if (val < 0.75) return 'Loose interpretation — expect the unexpected';
        return 'Maximum creativity — anything goes!';
      }

      function getColor(val) {
        if (val < 0.15) return '#3b82f6';
        if (val < 0.35) return '#22c55e';
        if (val < 0.55) return '#a855f7';
        if (val < 0.75) return '#f97316';
        return '#ef4444';
      }

      // Floating button
      var btn = document.createElement('button');
      btn.id = 'cr-btn';
      btn.title = 'Creativity Control (Auto-Gen)';
      btn.textContent = '\u2728';
      btn.style.cssText = 'position:fixed;bottom:250px;right:16px;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,' + getColor(currentVal) + ',' + getColor(Math.min(1, currentVal + 0.15)) + ');color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;text-decoration:none;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,0.4);transition:all 0.25s;cursor:pointer;border:none;';
      btn.onmouseenter = function() { this.style.transform = 'scale(1.1)'; };
      btn.onmouseleave = function() { this.style.transform = 'scale(1)'; };
      btn.setAttribute('data-hs-float', '1');
      document.body.appendChild(btn);

      // Panel
      var panel = document.createElement('div');
      panel.id = 'cr-panel';
      panel.style.cssText = 'position:fixed;bottom:304px;right:16px;width:270px;background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;z-index:10000;box-shadow:0 8px 32px rgba(0,0,0,0.5);display:none;color:#e2e8f0;font-family:system-ui,sans-serif;font-size:13px;';
      panel.innerHTML =
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">' +
        '<b style="font-size:14px;color:#f1f5f9;">\u2728 Creativity</b>' +
        '<button id="cr-close" style="background:none;border:none;color:#94a3b8;font-size:16px;cursor:pointer;padding:0;line-height:1;">\u2715</button></div>' +
        '<div style="text-align:center;margin-bottom:4px;">' +
        '<span id="cr-label" style="font-size:15px;font-weight:600;color:' + getColor(currentVal) + ';">' + getLabel(currentVal) + '</span></div>' +
        '<input type="range" id="cr-slider" min="0" max="1" step="0.01" value="' + currentVal + '" style="width:100%;height:6px;cursor:pointer;">' +
        '<div style="display:flex;justify-content:space-between;font-size:10px;color:#64748b;margin:4px 0 8px 0;">' +
        '<span>Strict</span><span style="margin-left:8px;">Balanced</span><span>Creative</span><span>Wild</span></div>' +
        '<div id="cr-desc" style="font-size:11px;color:#94a3b8;line-height:1.4;text-align:center;">' + getDesc(currentVal) + '</div>';
      document.body.appendChild(panel);

      // Toggle panel
      btn.onclick = function() {
        var isVisible = panel.style.display !== 'none';
        panel.style.display = isVisible ? 'none' : 'block';
      };
      document.getElementById('cr-close').onclick = function() {
        panel.style.display = 'none';
      };

      // Slider handler
      var slider = document.getElementById('cr-slider');
      var label = document.getElementById('cr-label');
      var desc = document.getElementById('cr-desc');
      slider.oninput = function() {
        var val = parseFloat(this.value);
        currentVal = val;
        localStorage.setItem(STORAGE_KEY, val);
        var color = getColor(val);
        label.textContent = getLabel(val);
        label.style.color = color;
        desc.textContent = getDesc(val);
        btn.style.background = 'linear-gradient(135deg,' + color + ',' + getColor(Math.min(1, val + 0.15)) + ')';
      };
    })();
    </script>

    <!-- Collapsible Floating Icon Tray — pill at bottom:60px (the floor), icons stack above -->
    <style>
      body.hs-float-collapsed [data-hs-float="1"] {
        display: none !important;
      }
    </style>
    <script>
      (function() {
        var STORAGE_KEY = 'hs-floating-collapsed';
        var isCollapsed = localStorage.getItem(STORAGE_KEY) === 'true';

        function closePanels() {
          var crPanel = document.getElementById('cr-panel');
          var caPanel = document.getElementById('cover-art-engine-panel');
          if (crPanel) crPanel.style.display = 'none';
          if (caPanel) caPanel.style.display = 'none';
        }

        function applyState(collapsed) {
          document.body.classList.toggle('hs-float-collapsed', collapsed);
          if (collapsed) closePanels();
          pill.textContent = collapsed ? '\u25B2' : '\u25BC';
          pill.title = collapsed ? 'Show floating tools' : 'Hide floating tools';
        }

        var pill = document.createElement('button');
        pill.id = 'hs-floating-toggle';
        pill.title = '';
        pill.style.cssText =
          'position:fixed;bottom:60px;right:16px;width:44px;height:18px;' +
          'border-radius:9px;border:1px solid rgba(148,163,184,0.3);' +
          'background:rgba(30,41,59,0.6);color:#94a3b8;font-size:10px;' +
          'display:flex;align-items:center;justify-content:center;' +
          'z-index:10001;cursor:pointer;padding:0;' +
          'font-family:system-ui,sans-serif;line-height:1;';
        pill.onmouseenter = function() {
          this.style.background = 'rgba(51,65,85,0.8)';
          this.style.color = '#e2e8f0';
          this.style.borderColor = 'rgba(148,163,184,0.6)';
        };
        pill.onmouseleave = function() {
          this.style.background = 'rgba(30,41,59,0.6)';
          this.style.color = '#94a3b8';
          this.style.borderColor = 'rgba(148,163,184,0.3)';
        };
        pill.onclick = function() {
          isCollapsed = !isCollapsed;
          localStorage.setItem(STORAGE_KEY, isCollapsed ? 'true' : 'false');
          applyState(isCollapsed);
        };

        document.body.appendChild(pill);
        applyState(isCollapsed);
      })();
    </script>
  </body>
